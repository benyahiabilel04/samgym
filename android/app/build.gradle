plugins { id 'com.android.application' }

android {
    namespace 'com.samgym.app'
    compileSdk 34
    defaultConfig {
        applicationId 'com.samgym.app'
        minSdk 24
        // 28 عمدا: يسمح لـ Tailscale بقراءة واجهات الشبكة (netlink) على أندرويد 11+، والتطبيق يُثبَّت يدويا (APK) لا عبر Google Play
        targetSdk 28
        versionCode 1
        versionName '1.0'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
        externalNativeBuild { cmake { cppFlags '-std=c++17' } }
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt' } }
    sourceSets { main { jniLibs.srcDirs = ['libnode/bin', 'tsfunnel-libs'] } }
    packaging { jniLibs { useLegacyPackaging = true; pickFirsts += ['**/libc++_shared.so'] } }
    buildFeatures { buildConfig true }
    lint { abortOnError false; checkReleaseBuilds false }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
