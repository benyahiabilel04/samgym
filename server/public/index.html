  h1,h2,h3,.brand{font-family:'Cairo',sans-serif;}
  button{font-family:inherit; cursor:pointer;}
  input,select{font-family:inherit;}
  ::selection{background:var(--gold); color:#111;}

  /* ---------- Utility ---------- */
  .hidden{display:none !important;}
  .row{display:flex; align-items:center;}
  .grow{flex:1;}
  .muted{color:var(--muted);}
  .gold{color:var(--gold);}
  .btn{
    border:none; border-radius:var(--radius-sm); padding:10px 18px;
    font-weight:700; font-size:14px; transition:.2s; white-space:nowrap;
  }
  .btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold2)); color:#111;}
  .btn-gold:hover{box-shadow:var(--glow); transform:translateY(-1px);}
  .btn-outline{background:transparent; border:1.5px solid var(--gold); color:var(--gold);}
  .btn-outline:hover{background:rgba(255,215,0,.08); box-shadow:var(--glow);}
  .btn-ghost{background:var(--card2); color:var(--text); border:1px solid var(--line);}
  .btn-ghost:hover{border-color:var(--gold);}
  .btn-danger{background:linear-gradient(135deg,#ff5252,#c62828); color:#fff;}
  .btn-danger:hover{box-shadow:0 0 18px rgba(255,82,82,.4);}
  .btn-wa{background:#25D366; color:#0a2e17; font-weight:800;}
  .btn-wa:hover{box-shadow:0 0 18px rgba(37,211,102,.45);}
  body.no-settings-access .icon-btn-settings{display:none !important;}
  body.no-perm-expenses .icon-btn-expenses, body.no-perm-view_finance #finToggleBtn,
  body.no-perm-edit_members .perm-edit, body.no-perm-delete_members .perm-delete,
  body.no-perm-add_members .perm-add, body.no-perm-renew_members .perm-renew,
  body.no-perm-send_reminders .perm-reminder{display:none !important;}
  .srv-perms{display:flex; flex-direction:column; gap:8px; margin-top:6px;}
  .srv-perms label{display:flex; align-items:center; gap:8px; font-size:13.5px; color:var(--text); margin:0; cursor:pointer;}
  .srv-perms input[type=checkbox]{width:20px; height:20px; margin:0; flex:none; accent-color:var(--gold); cursor:pointer;}
  #srvBadge{position:fixed; bottom:8px; left:8px; z-index:60; display:none; align-items:center; padding:5px 11px; border-radius:20px;
    font-size:11px; font-weight:700; background:var(--card2); color:var(--text); border:1px solid var(--line); opacity:.9; cursor:pointer; max-width:calc(100vw - 16px);}
  #srvBadge.off{border-color:var(--red); color:var(--red);}
  .srv-user{display:flex; align-items:center; gap:6px; flex-wrap:wrap; padding:8px 0; border-bottom:1px solid var(--line);}
  .srv-user.off{opacity:.5;}
  .srv-user-name{flex:1; min-width:90px; font-weight:700;}
  .srv-user select{width:auto; padding:6px 8px;}
  .btn-sm{padding:7px 12px; font-size:12.5px; border-radius:10px;}
  .icon-btn{
    background:var(--card2); border:1px solid var(--line); color:var(--text);
    width:38px; height:38px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:16px;
    transition:all .2s ease;
  }
  .icon-btn:hover{border-color:var(--gold); color:var(--gold);}

  .icon-btn-settings{
    width:30px; height:30px; border-radius:9px; font-size:14px;
    background:linear-gradient(145deg, var(--card2), var(--card));
    border:1.5px solid rgba(255,215,0,.35); color:var(--gold);
    flex-shrink:0;
  }
  .icon-btn-settings:hover, .icon-btn-settings:active{
    border-color:var(--gold); color:var(--gold2);
  }

  .icon-btn-logout{
    width:30px; height:30px; border-radius:9px;
    background:linear-gradient(145deg, rgba(255,82,82,.12), var(--card));
    border:1.5px solid rgba(255,82,82,.4); color:var(--red);
    flex-shrink:0;
  }
  .icon-btn-logout svg{ transform:scaleX(-1); }
  .icon-btn-logout:hover, .icon-btn-logout:active{
    border-color:var(--red); color:#ff8a8a;
  }

  /* ---------- Login ---------- */
  #loginScreen{
    min-height:100vh; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:22px; padding:24px;
  }
  .badge{
    display:flex; flex-direction:column; align-items:center; gap:14px; width:100%;
  }
  .badge-ring{
    width:112px; height:112px; border-radius:50%;
    border:3px solid var(--gold); display:flex; align-items:center; justify-content:center;
    box-shadow:var(--glow); background:radial-gradient(circle at 50% 35%, #fdfdfd, #eae6da);
    flex-shrink:0; overflow:hidden; padding:8px;
  }
  .badge-ring img{width:100%; height:100%; object-fit:contain;}
  .badge-ring svg{width:46px; height:46px; color:var(--gold);}
  /* ---- Professional, perfectly-centered brand lockup (used on login & app header) ---- */
  .brand-lockup{
    direction:ltr; display:inline-flex; align-items:center; justify-content:center;
    gap:0; margin:0; max-width:100%;
  }
  .brand-lockup .brand-text{display:flex; flex-direction:column; align-items:center; line-height:1.15;}
  .brand-lockup .brand-name{
    font-family:'Cairo',sans-serif; font-weight:900; text-transform:uppercase;
    font-size:30px; letter-spacing:4px; white-space:nowrap;
    background:linear-gradient(135deg, var(--gold) 0%, var(--gold2) 55%, #fff3bf 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .brand-lockup .brand-rule{width:46px; height:2px; margin:6px 0; border-radius:2px;
    background:linear-gradient(90deg, transparent, var(--gold), transparent);}
  .brand-lockup .brand-sub-text{
    font-family:'Cairo',sans-serif; font-weight:800; font-size:14px; letter-spacing:3.5px;
    text-transform:uppercase; color:var(--text); white-space:nowrap;
  }
  .brand-sub{color:var(--muted); font-size:13px; width:100%; text-align:center; direction:rtl;}
  .login-card{
    background:rgba(20,20,20,.85); backdrop-filter:blur(6px);
    border:1px solid var(--line); border-radius:var(--radius);
    padding:26px; width:100%; max-width:340px; display:flex; flex-direction:column; gap:14px;
  }
  .field label{font-size:13px; color:var(--muted); display:block; margin-bottom:6px;}
  .field input, .field select{
    width:100%; padding:11px 13px; border-radius:11px; border:1px solid var(--line);
    background:var(--bg-soft); color:var(--text); font-size:15px; outline:none;
  }
  .field input:focus, .field select:focus{border-color:var(--gold); box-shadow:0 0 0 3px rgba(255,215,0,.12);}
  .err-msg{color:var(--red); font-size:13px; min-height:16px;}
  .hint-note{font-size:11.5px; color:var(--muted); text-align:center; line-height:1.7;}

  /* ---------- Activation / Trial ---------- */
  .trial-badge{
    text-align:center; font-size:12.5px; color:var(--gold); background:rgba(255,215,0,.08);
    border:1px solid rgba(255,215,0,.35); border-radius:10px; padding:8px 10px; line-height:1.6;
  }
  .trial-badge.expired{color:var(--red); background:rgba(255,82,82,.08); border-color:rgba(255,82,82,.35);}
  .device-box{
    display:flex; align-items:center; gap:8px; background:var(--bg-soft); border:1px dashed var(--line);
    border-radius:11px; padding:10px 13px;
  }
  .device-box .code{flex:1; font-weight:900; letter-spacing:3px; color:var(--gold); font-size:18px; text-align:center; word-break:break-all;}
  .device-box button{background:var(--card2); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:6px 10px; font-size:12px;}
  .device-box button:hover{border-color:var(--gold);}
  #activationCodeInput{text-transform:uppercase; letter-spacing:3px; text-align:center;}

  /* ---------- App shell ---------- */
  #app{max-width:1180px; margin:0 auto; padding:14px 20px 40px;}
  header.top{display:flex; flex-direction:column; align-items:center; gap:10px; margin-bottom:16px;}
  .logo-row{display:flex; direction:ltr; align-items:center; justify-content:center; width:100%; gap:10px;}
  .logo-mini{
    width:52px; height:52px; border-radius:50%; border:2px solid var(--gold);
    display:flex; align-items:center; justify-content:center; color:var(--gold);
    box-shadow:var(--glow); flex-shrink:0; overflow:hidden; padding:5px;
    background:radial-gradient(circle at 50% 35%, #fdfdfd, #eae6da);
  }
  .logo-mini img{width:100%; height:100%; object-fit:contain;}
  .logo-mini svg{width:24px; height:24px;}
  .logo-row .brand-lockup{margin:0;}
  .logo-row .brand-lockup .brand-name{font-size:22px; letter-spacing:2.5px;}

  .header-controls{

  .header-actions .icon-btn-logout{background:linear-gradient(145deg, rgba(255,82,82,.14), var(--card)); border-color:rgba(255,82,82,.45); color:var(--red);}
  .header-actions .icon-btn-logout:hover, .header-actions .icon-btn-logout:active{border-color:var(--red); color:#ff8a8a; box-shadow:0 4px 12px rgba(255,82,82,.2);}

  /* نافذة مسح QR المشترك */
  .qrs-box{position:relative; width:100%; aspect-ratio:4/3; max-height:62vh; background:#000; border-radius:14px; overflow:hidden;}
  .qrs-box video{width:100%; height:100%; object-fit:cover; display:block;}
  .qrs-frame{position:absolute; inset:14%; pointer-events:none;}
  .qrs-frame i{position:absolute; width:34px; height:34px; border:4px solid var(--gold);}
  .qrs-frame i:nth-child(1){top:0; left:0; border-right:0; border-bottom:0; border-radius:10px 0 0 0;}
  .qrs-frame i:nth-child(2){top:0; right:0; border-left:0; border-bottom:0; border-radius:0 10px 0 0;}
  .qrs-frame i:nth-child(3){bottom:0; left:0; border-right:0; border-top:0; border-radius:0 0 0 10px;}
  .qrs-frame i:nth-child(4){bottom:0; right:0; border-left:0; border-top:0; border-radius:0 0 10px 0;}
  .qrs-frame b{position:absolute; left:4%; right:4%; height:2px; top:4%; background:linear-gradient(90deg, transparent, var(--gold), transparent); animation:qrsl 2.2s ease-in-out infinite;}
  @keyframes qrsl{0%,100%{top:4%} 50%{top:94%}}
  .qrs-msg{text-align:center; font-size:14px; font-weight:700; color:var(--muted); min-height:22px;}
  .qrs-msg.err{color:#fb7185;} .qrs-msg.ok{color:#34d399;}
  #qrScanCam{width:100%;}

  /* ---------- Custom professional dropdowns (csel) ---------- */
  select.csel-native{ display:none !important; }
  .csel{ position:relative; min-width:0; }
  .csel-btn{
    width:100%; display:flex; align-items:center; justify-content:space-between; gap:6px;
    background:var(--bg-soft); border:1px solid var(--line); color:var(--text);
    border-radius:11px; padding:11px 12px; font-size:13.5px; font-weight:700; cursor:pointer;
    transition:.18s; text-align:right; font-family:inherit;
  }
  .csel-btn:hover{ border-color:var(--gold); }
  .csel.open .csel-btn{ border-color:var(--gold); box-shadow:0 0 0 3px rgba(255,215,0,.12); }
  .csel-btn .csel-label{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .csel-btn .csel-arrow{ flex-shrink:0; font-size:10px; color:var(--muted); transition:transform .2s; }
  .csel.open .csel-btn .csel-arrow{ transform:rotate(180deg); color:var(--gold); }
  .csel-menu{
    position:absolute; top:calc(100% + 8px); right:0; left:0; z-index:60;
    background:var(--card2); border:1px solid var(--line); border-radius:13px;
    box-shadow:0 16px 36px rgba(0,0,0,.55), var(--glow); max-height:260px; overflow-y:auto;
    opacity:0; transform:translateY(-8px) scale(.97); pointer-events:none; transition:.16s ease;
    padding:6px; display:flex; flex-direction:column; gap:2px;
  }
  .csel.open .csel-menu{ opacity:1; transform:translateY(0) scale(1); pointer-events:auto; }
  .csel-option{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:10px 12px; border-radius:9px; font-size:13.5px; color:var(--text); cursor:pointer;
    transition:.12s; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .csel-option:hover{ background:var(--bg-soft); color:var(--gold); }
  .csel-option.selected{
    background:linear-gradient(135deg, rgba(255,215,0,.18), rgba(255,193,7,.08));
    color:var(--gold); font-weight:800;
  }
  .csel-option .chk{ opacity:0; color:var(--gold); font-size:12px; flex-shrink:0; }
  .csel-option.selected .chk{ opacity:1; }
  .csel-compact .csel-btn{ padding:8px 6px; font-size:12.5px; border-radius:9px; gap:3px; }
  .csel-compact .csel-menu{ font-size:12.5px; max-height:220px; }
  .csel-year{ flex:0 0 auto; width:52px; }
  .csel-year .csel-menu{ left:auto; right:0; min-width:100px; }
  .csel-month{ flex:1.6; min-width:0; }
  #cselWrap-subTypeFilter .csel-menu{ min-width:230px; left:0; right:auto; }
  #cselWrap-subTypeFilter .csel-option{ white-space:normal; overflow:visible; text-overflow:clip; line-height:1.4; }
  #cselWrap-fSubType .csel-option{ white-space:normal; overflow:visible; text-overflow:clip; line-height:1.4; }
  #cselWrap-fSubType .csel-btn{ white-space:normal; height:auto; min-height:44px; line-height:1.4; }
  #cselWrap-fSubType .csel-btn .csel-label{ white-space:normal; }

  /* ---------- Dashboard counters ---------- */
  .counters{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:14px;}
  .counter{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius-sm);
    padding:12px 6px; text-align:center;
  }
  .counter .num{font-family:'Cairo'; font-weight:900; font-size:20px;}
  .counter .lbl{font-size:11px; color:var(--muted); margin-top:2px;}
  .counter.total .num{color:var(--gold);}
  .counter.active .num{color:var(--green);}
  .counter.soon .num{color:var(--orange);}
  .counter.expired .num{color:var(--red);}

  }

     PRO UI — المصاريف / المحاسبة / البرنامج الغذائي

  .modal.modal-pro{max-width:480px; padding:0; overflow:hidden; display:flex; flex-direction:column; border-color:rgba(255,215,0,.18);
    box-shadow:0 -10px 40px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.02) inset;}

  .modal-pro .modal-head{margin:0; padding:18px 20px 14px; gap:12px; justify-content:flex-start;
    background:linear-gradient(180deg, rgba(255,215,0,.07), transparent); border-bottom:1px solid var(--line);}
  .modal-pro .modal-head h3{flex:1; font-family:'Cairo',sans-serif; font-weight:900; font-size:19px; letter-spacing:.2px;}

  .modal-pro .exp-period-label{margin:0; font-family:'Cairo',sans-serif; font-size:12.5px; font-weight:700; letter-spacing:.3px;
    display:flex; align-items:center; justify-content:center; gap:8px;}
  .modal-pro .exp-period-label::before,.modal-pro .exp-period-label::after{content:''; height:1px; flex:1; background:var(--line);}
  .pro-stats{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .pro-stat{background:linear-gradient(180deg,var(--card2),var(--card)); border:1px solid var(--line); border-radius:16px; padding:14px 12px 12px; position:relative; overflow:hidden; text-align:center;}
  .pro-stat::before{content:''; position:absolute; inset:0 0 auto 0; height:3px; background:rgb(var(--acc)); opacity:.9;}
  .pro-stat .ps-ico{width:36px; height:36px; margin:0 auto 8px; border-radius:11px; display:grid; place-items:center; background:rgba(var(--acc),.14); color:rgb(var(--acc)); border:1px solid rgba(var(--acc),.35);}
  .pro-stat .ps-ico svg{width:19px; height:19px; fill:none; stroke:currentColor; stroke-width:2.1; stroke-linecap:round; stroke-linejoin:round;}
  .pro-stat .ps-v{font-family:'Cairo',sans-serif; font-weight:900; font-size:21px; line-height:1.2; color:rgb(var(--acc)); word-break:break-word;}
  .pro-stat .ps-l{font-size:11.5px; color:var(--muted); margin-top:4px; line-height:1.5;}
  .pro-stat.wide{grid-column:1 / -1; display:flex; align-items:center; gap:14px; text-align:right; padding:14px;}
  .pro-stat.wide .ps-ico{margin:0; width:44px; height:44px; flex:none;}
  .pro-stat.wide .ps-txt{flex:1; min-width:0;}
  .pro-stat.wide .ps-v{font-size:22px;}
  .pro-stat.wide .ps-l{margin-top:2px; font-size:12px;}
  .pro-net{grid-column:1 / -1; border-radius:18px; padding:18px 16px; text-align:center; position:relative; overflow:hidden;
    background:linear-gradient(135deg, rgba(var(--acc),.20), rgba(var(--acc),.05)); border:1.5px solid rgba(var(--acc),.55);
    box-shadow:0 10px 28px rgba(var(--acc),.14), inset 0 1px 0 rgba(255,255,255,.05);}
  .pro-net .pn-l{font-size:12.5px; color:var(--muted); font-weight:700; display:flex; align-items:center; justify-content:center; gap:6px;}
  .pro-net .pn-v{font-family:'Cairo',sans-serif; font-weight:900; font-size:34px; line-height:1.25; margin-top:4px; color:rgb(var(--acc)); direction:ltr; word-break:break-word;}
  .pro-net .pn-badge{display:inline-flex; align-items:center; gap:5px; margin-top:6px; padding:3px 12px; border-radius:999px; font-size:11.5px; font-weight:800;
    background:rgba(var(--acc),.16); color:rgb(var(--acc)); border:1px solid rgba(var(--acc),.4);}
  .pro-ratio{grid-column:1 / -1; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:12px 14px;}
  .pro-ratio .pr-top{display:flex; justify-content:space-between; align-items:center; font-size:12px; color:var(--muted); margin-bottom:8px;}
  .pro-ratio .pr-top b{font-family:'Cairo',sans-serif; font-size:13.5px; color:var(--text);}
  .pro-ratio .pr-bar{height:9px; border-radius:9px; background:var(--card2); border:1px solid var(--line); overflow:hidden; direction:rtl;}
  .pro-ratio .pr-fill{height:100%; border-radius:9px; background:linear-gradient(90deg,var(--green),var(--orange) 60%,var(--red)); background-size:var(--bw,100%) 100%; background-repeat:no-repeat; transition:width .45s ease;}

  /* diet */
  .pro-drop{display:flex; flex-direction:column; align-items:center; gap:8px; padding:24px 16px; text-align:center; cursor:pointer; transition:.2s;
    border:2px dashed rgba(255,215,0,.4); border-radius:18px; background:linear-gradient(180deg, rgba(255,215,0,.07), rgba(255,215,0,.015));}
  .pro-drop:hover,.pro-drop.over{border-color:var(--gold); background:rgba(255,215,0,.12); transform:translateY(-1px);}
  .pro-drop .pd-ico{width:54px; height:54px; border-radius:16px; display:grid; place-items:center; background:linear-gradient(135deg,var(--gold),var(--gold2)); color:#111; box-shadow:0 8px 20px rgba(255,193,7,.3);}
  .pro-drop .pd-ico svg{width:27px; height:27px; fill:none; stroke:currentColor; stroke-width:2.1; stroke-linecap:round; stroke-linejoin:round;}
  .pro-drop .pd-t{font-weight:800; font-size:15px; color:var(--text);}
  .pro-drop .pd-s{font-size:12px; color:var(--muted); line-height:1.6;}
  .pro-drop .pd-fmt{display:flex; gap:6px; flex-wrap:wrap; justify-content:center; margin-top:2px;}
  .pro-drop .pd-fmt span{font-size:10.5px; font-weight:800; letter-spacing:.5px; padding:2px 9px; border-radius:999px; background:var(--card2); border:1px solid var(--line); color:var(--muted);}
  .pro-drop input[type=file]{display:none;}
  .modal-pro .diet-list{max-height:none; overflow:visible; gap:8px;}
  .modal-pro .diet-row{padding:10px; gap:12px; border-radius:14px; transition:.2s;}
  .modal-pro .diet-row:hover{border-color:rgba(255,215,0,.4);}
  .modal-pro .diet-thumb{width:48px; height:48px; border-radius:12px;}
  .modal-pro .diet-thumb.ft{flex-direction:column; gap:1px; font-family:'Cairo',sans-serif; font-weight:900; font-size:11px; letter-spacing:.5px;
    background:rgba(var(--acc),.14); color:rgb(var(--acc)); border-color:rgba(var(--acc),.4);}
  .modal-pro .diet-thumb.ft svg{width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round;}
  .modal-pro .diet-actions{gap:6px;}
  .modal-pro .diet-actions button{padding:0;}
  .modal-pro .diet-send-preview{border-radius:14px;}
  .modal-pro .diet-send-preview .diet-thumb{width:48px; height:48px;}
  @media(max-width:380px){ .pro-net .pn-v{font-size:28px;} .pro-stat .ps-v{font-size:18px;} }

  /* ---------- Controls: search/filter/add ---------- */
  .controls{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px;}
  .controls input[type=text]{
    flex:1; min-width:140px; padding:10px 14px; border-radius:11px; border:1px solid var(--line);
    background:var(--card); color:var(--text); outline:none;
  }
  .controls input[type=text]:focus{border-color:var(--gold);}
  .controls select{
    padding:10px 10px; border-radius:11px; border:1px solid var(--line); background:var(--card); color:var(--text);
  }

  /* ---------- Toolbar (search + filter + add) ---------- */
  .toolbar{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:12px; margin-bottom:14px; display:flex; flex-direction:column; gap:10px;
  }
  .search-wrap{position:relative; display:flex; align-items:center;}
  .search-wrap .search-icon{
    position:absolute; right:14px; font-size:15px; color:var(--muted); pointer-events:none;
  }
  .search-wrap input[type=text]{
    width:100%; padding:12px 42px 12px 40px; border-radius:12px; border:1px solid var(--line);
    background:var(--bg-soft); color:var(--text); font-size:14.5px; outline:none; transition:.2s;
  }
  .search-wrap input[type=text]:focus{border-color:var(--gold); box-shadow:0 0 0 3px rgba(255,215,0,.12);}
  .search-clear{
    position:absolute; left:10px; background:var(--card2); border:none; color:var(--muted);
    width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:12px; line-height:1; padding:0;
  }
  .search-clear:hover{color:var(--red); border-color:var(--red);}
  .toolbar-row2{display:flex; gap:8px;}
  .toolbar-row2 .csel{flex:1; min-width:0;}
  .toolbar-row2 select{
    flex:1; min-width:0; padding:11px 10px; border-radius:11px; border:1px solid var(--line);
    background:var(--bg-soft); color:var(--text); font-size:13.5px; outline:none;
  }
  .toolbar-row2 select:focus{border-color:var(--gold);}
  .btn-add-full{width:100%; display:flex; align-items:center; justify-content:center; gap:6px;}

  /* ---------- Members list ---------- */
  #membersList{display:flex; flex-direction:column; gap:9px;}
  .member-row{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius-sm);
    padding:11px 13px; display:flex; flex-direction:row-reverse; align-items:center; gap:12px; transition:.15s;
  }
  .member-row:hover{border-color:var(--gold); box-shadow:var(--glow); cursor:pointer;}
  .avatar{
    width:64px; height:64px; border-radius:50%; object-fit:cover; border:2px solid var(--line); flex-shrink:0; background:#111;
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:18px; color:var(--gold); font-family:'Cairo';
  }
  .avatar-placeholder{font-size:24px; color:var(--muted); background:var(--card2);}
  /* صورة المشترك في شريط قائمة المشتركين: مربعة وكبيرة ملاصقة لحافة الشريط */
  .member-row{padding:0; overflow:hidden; gap:0; min-height:104px;}
  .member-row .avatar{width:104px; min-width:104px; height:auto; min-height:104px; align-self:stretch; border-radius:0; border:0; object-fit:cover; font-size:34px;}
  .member-row .avatar-placeholder{font-size:38px;}
  .member-row .m-info{padding:11px 13px;}
  .member-row .status-dot{margin:0 13px;}
  @media(max-width:420px){ .member-row .avatar{width:92px; min-width:92px; min-height:92px;} }
  .m-info{flex:1; min-width:0;}
  .m-name{font-weight:700; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .m-plan{font-size:11.5px; color:var(--gold); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .m-sub{font-size:12px; color:var(--muted); margin-top:4px; display:flex; flex-wrap:wrap; align-items:center; gap:6px;}
  .m-sub > *{white-space:nowrap; line-height:1.4;}
  .status-dot{width:10px; height:10px; border-radius:50%; flex-shrink:0;}
  .status-dot.active{background:var(--green); box-shadow:0 0 8px var(--green);}
  .status-dot.soon{background:var(--orange); box-shadow:0 0 8px var(--orange);}
  .status-dot.expired{background:var(--red); box-shadow:0 0 8px var(--red);}
  .m-chips{display:flex; flex-direction:row; flex-wrap:nowrap; align-items:center; gap:6px; margin-top:6px;}
  .m-chips:empty{display:none;}
  .file-chip, .debt-chip, .wa-done-chip{
    display:inline-flex; align-items:center; justify-content:center; box-sizing:border-box;
    height:24px; padding:0 10px; border-radius:20px; font-size:11px; font-weight:700; line-height:1;
    white-space:nowrap; flex:0 0 auto;
  }
  .file-chip.yes{background:rgba(46,204,113,.15); color:var(--green); border:1px solid rgba(46,204,113,.4);}
  .file-chip.no{background:rgba(255,167,38,.15); color:var(--orange); border:1px solid rgba(255,167,38,.4);}
  .debt-chip{background:rgba(255,82,82,.12); color:var(--red); border:1px solid rgba(255,82,82,.3);}
  .wa-done-chip{background:rgba(37,211,102,.14); color:#25D366; border:1px solid rgba(37,211,102,.4); white-space:nowrap;}
  @media(max-width:420px){ .file-chip, .debt-chip, .wa-done-chip{padding:0 8px; font-size:10.5px;} .m-chips{gap:4px;} }
  .empty-state{text-align:center; color:var(--muted); padding:40px 10px; font-size:14px;}

  /* ---------- Modal ---------- */
  .modal-bg{
    position:fixed; inset:0; background:rgba(0,0,0,.72); display:flex; align-items:flex-end; justify-content:center;
    z-index:100; backdrop-filter:blur(2px);
  }
  @media(min-width:640px){ .modal-bg{align-items:center;} }
  .cam-overlay{z-index:200;}
  .modal{
    background:var(--bg-soft); border:1px solid var(--line); border-radius:20px 20px 0 0;
    width:100%; max-width:460px; max-height:92vh; overflow-y:auto; padding:20px; animation:slideUp .22s ease;
  }
  @media(min-width:640px){ .modal{border-radius:20px;} }
  .modal.modal-lg{max-width:540px; padding:24px;}
  .modal.modal-xl{max-width:min(780px,96vw); width:96vw; padding:28px;}
  @media(min-width:640px){ .modal.modal-xl{width:100%;} }
  .modal.modal-xl{padding-top:34px; padding-bottom:34px; min-height:min(72vh,760px);}
  .modal.modal-xl .form-grid{gap:18px;}
  .modal.modal-xl .field input, .modal.modal-xl .csel-btn{padding-top:15px; padding-bottom:15px;}
  .modal.modal-xl .photo-upload{margin-bottom:10px;}
  .modal.modal-xl .modal-head{margin-bottom:22px;}
  /* نافذة إضافة/تعديل مشترك: خلفية مختلفة عن خلفية البرنامج */
  .modal-bg.modal-bg-add{background:rgba(0,0,0,.9); backdrop-filter:blur(4px);}
  .modal.modal-add{
    background:linear-gradient(160deg,#3a3d46 0%,#2b2d34 100%);
    border:2px solid var(--gold);
    box-shadow:0 0 0 6px rgba(255,215,0,.10), 0 24px 70px rgba(0,0,0,.85);
  }
  .modal.modal-add .field input, .modal.modal-add .csel-btn{background:#15161a; border:1px solid #4b4f5a;}
  .modal.modal-add .field input:focus, .modal.modal-add .csel-btn:focus{border-color:var(--gold); box-shadow:0 0 0 3px rgba(255,215,0,.25); outline:none;}
  .modal.modal-add .photo-upload .preview{background:#15161a;}
  @keyframes slideUp{from{transform:translateY(30px); opacity:0;} to{transform:translateY(0); opacity:1;}}
  .modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
  .modal-head h3{margin:0; font-size:18px;}
  .modal-head .close{background:none; border:none; color:var(--muted); font-size:22px;}
  .modal-head .close:hover{color:var(--red);}
  .form-grid{display:flex; flex-direction:column; gap:12px;}

  /* photo upload */
  .photo-upload{display:flex; flex-direction:column; align-items:center; gap:8px; margin-bottom:4px;}
  .photo-upload .preview{
    width:130px; height:130px; border-radius:14px; object-fit:cover; border:2px dashed var(--gold);
    display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:12px; background:var(--card2);
  }
  .photo-actions{display:flex; gap:8px;}
  .photo-actions label{
    display:flex; align-items:center; gap:6px; background:var(--card2); border:1px solid var(--line); color:var(--text);
    padding:8px 14px; border-radius:10px; font-size:13px; font-weight:700; cursor:pointer; transition:.2s;
  }
  .photo-actions label:hover{border-color:var(--gold); color:var(--gold);}

  /* detail card */
  .detail-card{display:flex; flex-direction:row-reverse; gap:16px; align-items:flex-start; margin-bottom:16px;}
  .detail-card .avatar-lg{
    width:min(200px,44vw); height:min(200px,44vw); border-radius:14px; object-fit:cover; border:2px solid var(--gold); flex-shrink:0;
    display:flex; align-items:center; justify-content:center; background:var(--card2); font-family:'Cairo'; font-weight:900; color:var(--gold); font-size:40px;
  }
  .detail-card .avatar-lg.avatar-placeholder{font-size:56px; color:var(--muted);}
  .detail-card .avatar-lg:not(.avatar-placeholder){transition:transform .15s ease, box-shadow .15s ease;}
  .detail-card .avatar-lg:not(.avatar-placeholder):hover{transform:scale(1.04); box-shadow:var(--glow);}
  .photo-zoom-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.88); z-index:9999;
    display:flex; align-items:center; justify-content:center; padding:24px;
    animation:photoZoomFade .15s ease;
  }
  .photo-zoom-img{
    max-width:92vw; max-height:92vh; border-radius:16px; object-fit:contain;
    box-shadow:0 10px 40px rgba(0,0,0,.6); border:2px solid var(--gold);
    animation:photoZoomIn .18s ease;
  }
  @keyframes photoZoomFade{from{opacity:0} to{opacity:1}}
  @keyframes photoZoomIn{from{transform:scale(.85); opacity:0} to{transform:scale(1); opacity:1}}
  .detail-info{flex:1;}
  .detail-info h2{margin:0 0 4px; font-size:19px;}
  .status-pill{display:inline-block; padding:4px 12px; border-radius:20px; font-size:12px; font-weight:800; margin-top:4px;}
  .status-pill.active{background:rgba(46,204,113,.15); color:var(--green); border:1px solid rgba(46,204,113,.4);}
  .status-pill.soon{background:rgba(255,167,38,.15); color:var(--orange); border:1px solid rgba(255,167,38,.4);}
  .status-pill.renewed{background:rgba(46,204,113,.15); color:var(--green); border:1px solid rgba(46,204,113,.4);}
  .status-dot.renewed{background:var(--green); box-shadow:0 0 8px var(--green);}
  .status-pill.expired{background:rgba(255,82,82,.15); color:var(--red); border:1px solid rgba(255,82,82,.4);}
  /* ===== تنسيق احترافي لمنطقة الاسم والعبارات ===== */
  .member-row .m-info{display:flex; flex-direction:column; align-items:flex-start; justify-content:center; gap:6px; padding:12px 14px;}
  .m-name{font-size:17px; font-weight:800; color:#fff; line-height:1.3; max-width:100%;}
  .m-plan{display:inline-flex; align-items:center; max-width:100%; margin-top:0; padding:3px 10px; border-radius:8px; background:rgba(255,215,0,.09); border:1px solid rgba(255,215,0,.28); color:var(--gold); font-size:11.5px; font-weight:700;}
  .m-sub{margin-top:0; font-size:12.5px; color:#c9ced4; gap:8px;}
  .m-chips{flex-wrap:wrap; margin-top:2px; gap:6px;}
  .detail-card{background:linear-gradient(145deg, var(--card2), var(--card)); border:1px solid var(--line); border-radius:18px; padding:14px; gap:18px; align-items:flex-start;}
  .detail-card .avatar-lg{width:min(190px,42vw); height:auto; aspect-ratio:1/1; align-self:flex-start; border-radius:14px;}
  .detail-info{display:flex; flex-direction:column; justify-content:center; align-items:flex-start; gap:10px; min-width:0; align-self:center;}
  .detail-info h2.detail-name{margin:0; font-size:23px; font-weight:900; line-height:1.25; color:#fff; word-break:break-word;}
  .detail-info h2.detail-name::after{content:''; display:block; width:46px; height:3px; border-radius:3px; background:var(--gold); margin-top:8px;}
  .detail-phone{display:inline-flex; align-items:center; gap:8px; font-size:14px; font-weight:700; color:#d6dbe0; background:rgba(255,255,255,.05); border:1px solid var(--line); border-radius:10px; padding:5px 11px;}
  .detail-badges{display:flex; flex-wrap:wrap; align-items:center; gap:8px;}
  .detail-badges .status-pill{margin-top:0;}
  .detail-badges .wa-done-chip{margin:0 !important;}
  .m-name, .detail-info h2.detail-name{text-transform:uppercase; letter-spacing:.4px;}
  .ico{vertical-align:-2px; margin-inline-end:4px; flex:none;}
  .detail-phone .ico{margin-inline-end:0; color:var(--gold);}
  .detail-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px;}
  .detail-item{background:var(--card); border:1px solid var(--line); border-radius:11px; padding:10px 12px;}
  .detail-item .l{font-size:11px; color:var(--muted);}
  .detail-item .v{font-weight:800; font-size:14.5px; margin-top:3px;}
  .detail-actions{display:flex; flex-direction:column; gap:8px;}
  /* أزرار بطاقة المشترك ثابتة أسفل النافذة بدون الحاجة للنزول */
  .modal.modal-lg .detail-actions{position:sticky; bottom:-24px; z-index:5; margin:14px -24px -24px; padding:12px 24px 24px; background:var(--bg-soft); border-top:1px solid var(--line); box-shadow:0 -8px 14px rgba(0,0,0,.25);}
  .modal.modal-lg .detail-actions .btn{padding-top:9px; padding-bottom:9px;}
  .modal-copy{text-align:center; color:var(--muted); font-size:11.5px; margin-top:10px; direction:ltr;}
  .detail-actions-row{display:flex; flex-wrap:wrap; gap:8px;}
  .detail-actions-row .btn{flex:1; min-width:90px; text-align:center;}
  .detail-actions-row .btn{display:flex; align-items:center; justify-content:center; gap:6px; min-height:42px;}
  .btn-wa-outline{background:transparent; border:1.5px solid #25D366; color:#25D366; font-weight:800;}
  .btn-app{background:transparent; border:1.5px solid #5b9dff; color:#7db2ff; font-weight:800;}
  .btn-app:hover{background:rgba(91,157,255,.12); box-shadow:0 0 18px rgba(91,157,255,.35);}
  .btn-app.done,.btn-app.done:hover{border-color:#556070; color:#8a96a6; background:rgba(120,130,145,.12); box-shadow:none; cursor:default;}
  .btn-wa-outline:hover{background:rgba(37,211,102,.1); box-shadow:0 0 18px rgba(37,211,102,.35);}

  /* settings */
  .settings-row{display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--line);}
  .settings-row:last-child{border-bottom:none;}
  .settings-divider{height:1px; background:var(--line); margin:6px 0;}
  .settings-section{border:1px solid var(--line); border-radius:var(--radius-sm); margin-bottom:10px; overflow:hidden; background:var(--card2);}
  .settings-section summary{
    cursor:pointer; padding:12px 14px; font-weight:800; font-family:'Cairo',sans-serif;
    display:flex; align-items:center; gap:8px; list-style:none; color:var(--gold);
  }
  .settings-section summary::-webkit-details-marker{display:none;}
  .settings-section summary::after{content:'⌄'; margin-inline-start:auto; transition:transform .2s;}
  .settings-section[open] summary::after{transform:rotate(180deg);}
  .settings-section .settings-section-body{padding:0 14px 14px; display:flex; flex-direction:column; gap:10px;}
  .pw-toggle-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--bg-soft); border:1px solid var(--line); border-radius:11px; padding:10px 12px;
  }
  .pw-toggle-row .pw-toggle-label{font-size:13px; font-weight:700; color:var(--text);}
  .pw-toggle-row .pw-toggle-hint{font-size:11px; color:var(--muted); margin-top:2px;}
  .switch{position:relative; display:inline-block; width:46px; height:26px; flex-shrink:0;}
  .switch input{opacity:0; width:0; height:0;}
  .switch .slider{
    position:absolute; cursor:pointer; inset:0; background:var(--line);
    border-radius:999px; transition:.2s;
  }
  .switch .slider::before{
    content:''; position:absolute; width:20px; height:20px; left:3px; top:3px;
    background:#f2f2f2; border-radius:50%; transition:.2s;
  }
  .switch input:checked + .slider{background:linear-gradient(135deg, var(--gold), var(--gold2)); box-shadow:0 0 10px rgba(255,215,0,.4);}
  .switch input:checked + .slider::before{transform:translateX(20px); background:#1a1a1a;}
  .pw-item{background:var(--bg-soft); border:1px solid var(--line); border-radius:11px; padding:10px 12px; display:flex; flex-direction:column; gap:8px;}
  .pw-item .pw-toggle-row{background:transparent; border:none; padding:0;}
  .pw-edit-toggle{
    background:none; border:none; color:var(--gold); font-size:12px; font-weight:700; cursor:pointer;
    display:flex; align-items:center; gap:4px; padding:2px 0; align-self:flex-start;
  }
  .pw-edit-box{display:flex; flex-direction:column; gap:8px; padding-top:6px; border-top:1px dashed var(--line);}
  #plansViewList{display:flex; flex-direction:column; gap:8px;}
  .plan-view-card{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--bg-soft); border:1px solid var(--line); border-radius:11px; padding:11px 14px;
  }
  .plan-view-name{font-weight:800; font-size:14px; color:var(--text);}
  .plan-view-price{font-weight:900; font-size:14px; color:var(--gold); white-space:nowrap;}
  .add-plan-box{
    background:var(--bg-soft); border:1px dashed rgba(255,215,0,.45); border-radius:13px;
    padding:14px; display:flex; flex-direction:column; gap:10px;
  }
  .add-plan-title{font-weight:800; font-size:13px; color:var(--gold);}
  .add-plan-row{display:flex; gap:8px;}
  .add-plan-row input{
    flex:1; min-width:0; padding:11px 13px; border-radius:11px; border:1px solid var(--line);
    background:var(--card2); color:var(--text); font-size:14px; outline:none;
  }
  .add-plan-row input:focus{border-color:var(--gold); box-shadow:0 0 0 3px rgba(255,215,0,.12);}
  .pw-confirm-overlay{
    position:fixed; inset:0; z-index:250; background:rgba(0,0,0,.55); backdrop-filter:blur(2px);
    display:flex; align-items:center; justify-content:center; padding:16px;
  }
  .pw-confirm-box{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius-sm);
    padding:16px; width:100%; max-width:320px; display:flex; flex-direction:column; gap:10px;
  }
  .pw-confirm-box h4{margin:0; color:var(--gold); font-family:'Cairo',sans-serif;}
  .theme-swatches{display:flex; gap:10px; flex-wrap:wrap;}
  .theme-swatch{
    width:38px; height:38px; border-radius:50%; cursor:pointer; border:3px solid transparent;
    display:flex; align-items:center; justify-content:center; font-size:14px; color:#fff;
  }
  .theme-swatch.active{border-color:#fff; box-shadow:0 0 0 2px var(--card2);}

  footer.app-footer{text-align:center; margin-top:26px; color:var(--muted); font-size:11.5px;}

  /* ===== Home "المشتركين" big button + members page ===== */
  .btn-members-big{width:100%; display:flex; align-items:center; justify-content:center; gap:14px; padding:28px 16px; font-size:26px; font-weight:900; font-family:'Cairo',sans-serif; border-radius:20px; margin:8px 0 12px;}
  .btn-members-big .mb-ico{font-size:34px; line-height:1;}
  .btn-members-big .mb-count{background:rgba(0,0,0,.18); border-radius:999px; padding:2px 16px; font-size:20px;}
  .members-page-head{display:flex; align-items:center; gap:12px; margin-bottom:12px;}
  .members-page-head h2{margin:0; font-family:'Cairo',sans-serif; font-size:20px; color:var(--gold);}
  #homeView .btn-add-full{margin-bottom:12px;}
  /* ===== صفحة المشتركين المستقلة ===== */
  #membersPage .mp-head{cursor:pointer; -webkit-tap-highlight-color:transparent; transition:.2s; display:flex; align-items:center; gap:12px; padding:14px 16px; margin:0 0 12px; border-radius:18px;
    background:linear-gradient(180deg, rgba(255,215,0,.10), rgba(255,215,0,.03)); border:1.5px solid rgba(255,215,0,.55);
    box-shadow:0 4px 14px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.05);}
  #membersPage .mp-title{flex:1; text-align:center; font-family:'Cairo',sans-serif; font-size:22px; font-weight:900; color:var(--gold);}
  #membersPage .mp-ico, #membersPage .mp-back{width:46px; height:46px; border-radius:14px; display:grid; place-items:center; flex:none;
    background:rgba(255,215,0,.14); border:1px solid rgba(255,215,0,.40); color:var(--gold);}
  #membersPage .mp-back{border-radius:50%; width:40px; height:40px; cursor:pointer; padding:0; transition:.2s;}
  #membersPage .mp-head:hover{background:rgba(255,215,0,.15); border-color:var(--gold);}
  #membersPage .mp-head:active{transform:scale(.99);}
  #membersPage .mp-ico .ic{width:24px; height:24px;}
  #membersPage .mp-back .ic{width:18px; height:18px; stroke-width:3;}

  /* ===== الصفحة الرئيسية والفلاتر — تنسيق احترافي ===== */
  .ic{width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none; display:block;}
  #homeView .btn-add-full{height:56px; padding:0 18px; border-radius:16px; font-size:16px; font-weight:800; gap:12px; border:1.5px solid rgba(255,215,0,.55); background:linear-gradient(180deg, rgba(255,215,0,.10), rgba(255,215,0,.03)), var(--hb-base); color:var(--gold); box-shadow:0 4px 14px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.05);}
  #homeView .btn-add-full:hover{transform:translateY(-1px); background:linear-gradient(rgba(255,215,0,.15), rgba(255,215,0,.15)), var(--hb-base); box-shadow:0 8px 20px rgba(255,193,7,.16);}
  .ico-badge{width:30px; height:30px; border-radius:50%; display:grid; place-items:center; background:linear-gradient(135deg,var(--gold),var(--gold2)); color:#111; box-shadow:0 2px 8px rgba(255,193,7,.35);}
  .ico-badge .ic{width:16px; height:16px; stroke-width:3;}
  .btn-members-big{display:flex; align-items:center; justify-content:space-between; gap:14px; padding:16px 20px; font-size:22px; border-radius:18px; box-shadow:0 10px 26px rgba(255,193,7,.22), inset 0 1px 0 rgba(255,255,255,.35);}
  .btn-members-big .mb-ico-wrap, .btn-members-big .mb-arrow{border-radius:50%; background:rgba(0,0,0,.14); display:grid; place-items:center; flex:none;}
  .btn-members-big .mb-ico-wrap{width:50px; height:50px; border-radius:15px;}
  .btn-members-big .mb-arrow{width:34px; height:34px;}
  .mb-ico-wrap .ic{width:27px; height:27px; stroke-width:2.1;}
  .mb-arrow .ic{width:18px; height:18px; stroke-width:3;}
  .btn-members-big .mb-text{flex:1; text-align:center; letter-spacing:.3px;}
  .btn-members-big:hover{transform:translateY(-2px); box-shadow:0 14px 30px rgba(255,193,7,.32), inset 0 1px 0 rgba(255,255,255,.4);}
  .btn-members-big:active{transform:translateY(0);}
  .btn-ctrl-big{width:100%; display:flex; align-items:center; justify-content:space-between; gap:14px; padding:16px 20px; margin:0 0 12px; font-size:22px; font-weight:900; font-family:'Cairo',sans-serif; border-radius:18px; cursor:pointer; color:#5cd0ff; background:linear-gradient(145deg, rgba(92,208,255,.16), var(--hb-base)); border:1px solid rgba(92,208,255,.5); box-shadow:0 10px 26px rgba(92,208,255,.14), inset 0 1px 0 rgba(255,255,255,.08); transition:transform .15s, box-shadow .15s;}
  .btn-ctrl-big .mb-ico-wrap, .btn-ctrl-big .mb-arrow{background:rgba(92,208,255,.14); border:1px solid rgba(92,208,255,.35); display:grid; place-items:center; flex:none;}
  .btn-ctrl-big .mb-ico-wrap{width:50px; height:50px; border-radius:15px;}
  .btn-ctrl-big .mb-arrow{width:34px; height:34px; border-radius:50%;}
  .btn-ctrl-big .mb-text{flex:1; text-align:center; letter-spacing:.3px;}
  .btn-ctrl-big:hover{transform:translateY(-2px); box-shadow:0 14px 30px rgba(92,208,255,.26);}
  .btn-ctrl-big:active{transform:translateY(0);}
  /* زر المشتركين: أصفر بخلفية شفافة مثل باقي الأزرار */
  .btn-members-big{background:linear-gradient(180deg, rgba(255,215,0,.10), rgba(255,215,0,.03)), var(--hb-base); border:1.5px solid rgba(255,215,0,.55); color:var(--gold); box-shadow:0 4px 14px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.05);}
  .btn-members-big .mb-ico-wrap{background:rgba(255,215,0,.14); border:1px solid rgba(255,215,0,.40); color:var(--gold);}
  .btn-members-big .mb-arrow{background:rgba(255,215,0,.14); color:var(--gold);}
  .btn-members-big:hover{background:linear-gradient(rgba(255,215,0,.15), rgba(255,215,0,.15)), var(--hb-base); border-color:var(--gold); box-shadow:0 8px 20px rgba(255,193,7,.16);}
  .toolbar{padding:14px; gap:12px; border-radius:18px;}
  .search-wrap .search-icon{right:16px; display:flex; color:var(--muted); transition:.2s;}
  .search-wrap .search-icon .ic{width:18px; height:18px;}
  .search-wrap:focus-within .search-icon{color:var(--gold);}
  .search-wrap input[type=text]{height:50px; padding:0 46px 0 46px; border-radius:14px; font-size:15px; border:1.5px solid var(--line);}
  .search-clear{width:28px; height:28px; left:12px; background:rgba(255,255,255,.08); cursor:pointer;}
  .search-clear .ic{width:13px; height:13px; stroke-width:3;}
  .toolbar-row2{gap:10px;}
  .toolbar-row2 .csel-btn{height:48px; padding:0 14px; border-radius:14px; border:1.5px solid var(--line); gap:10px; font-size:13.5px;}
  .toolbar-row2 .csel-btn .fi{display:flex; flex:none; color:var(--gold);}
  .toolbar-row2 .csel-btn .fi .ic{width:17px; height:17px;}
  .toolbar-row2 .csel-btn .csel-label{flex:1; text-align:start;}
  .toolbar-row2 .csel-btn .csel-arrow{font-size:0; width:8px; height:8px; border-right:2px solid var(--muted); border-bottom:2px solid var(--muted); transform:rotate(45deg); margin-top:-4px; transition:.2s;}
  .toolbar-row2 .csel.open .csel-btn .csel-arrow{transform:rotate(225deg); margin-top:4px; border-color:var(--gold);}

  /* ===== أزرار المحاسبة / البرنامج الغذائي / المصاريف ===== */
  body.no-perm-expenses .perm-expenses{display:none !important;}
  .home-tools{display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin:0 0 6px;}
  .tool-tile{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:11px; min-height:116px; padding:16px 6px 14px; border-radius:18px; cursor:pointer; font-family:'Cairo',sans-serif; font-weight:800; font-size:14px; color:var(--text);
    background:linear-gradient(160deg, rgba(var(--rgb),.16), var(--hb-base) 72%); border:1.5px solid rgba(var(--rgb),.38); box-shadow:0 6px 18px rgba(0,0,0,.28); transition:.2s;}
  .tool-tile:hover{transform:translateY(-3px); border-color:rgb(var(--rgb)); box-shadow:0 12px 26px rgba(var(--rgb),.22);}
  .tool-tile:active{transform:translateY(0);}
  .tool-tile .tt-ico{width:54px; height:54px; border-radius:16px; display:grid; place-items:center; color:rgb(var(--rgb)); background:rgba(var(--rgb),.14); border:1px solid rgba(var(--rgb),.35);}
  .tool-tile .tt-ico .ic{width:28px; height:28px;}
  .tool-tile .tt-text{line-height:1.25; text-align:center;}
  @media(max-width:420px){ .tool-tile{min-height:104px; font-size:12.5px; padding:14px 4px 12px; gap:9px;} .tool-tile .tt-ico{width:46px; height:46px; border-radius:14px;} .tool-tile .tt-ico .ic{width:24px; height:24px;} }
  /* خطوط الأزرار الرئيسية — مظهر احترافي موحّد */
  #homeView .btn-add-full, .btn-members-big, .btn-ctrl-big, .tool-tile{font-family:'Noto Kufi Arabic','Cairo',sans-serif; font-weight:600; letter-spacing:0; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;}
  #homeView .btn-add-full{font-size:15px;}
  .btn-members-big, .btn-ctrl-big{font-size:18px; font-weight:700;}
  .btn-ctrl-big{color:#7fdcff;}
  .tool-tile{font-size:13.5px;}
  .tool-tile .tt-text{line-height:1.3;}
  @media(max-width:420px){ .tool-tile{font-size:12.5px;} .btn-members-big, .btn-ctrl-big{font-size:16.5px;} }
</style>

let currentLang = 'ar';
function loadLanguage(){
  try{ currentLang = localStorage.getItem(LANG_KEY) || 'ar'; }catch(e){ currentLang = 'ar'; }
  applyLanguageChrome();
}
function t(key){ return (I18N[currentLang] && I18N[currentLang][key]) || I18N.ar[key] || key; }
function applyLanguageChrome(){
  document.documentElement.setAttribute('lang', currentLang);

/* ============================================================
   IndexedDB STORAGE — يحل مشكلة "الذاكرة ممتلئة"
   localStorage حدّه ~5MB فقط، أما IndexedDB فمساحته أكبر بكثير.
   البيانات الكبيرة (المشتركون + الصور، ملفات الحمية، خلفية البرنامج)
   تُحفظ هنا، وتُنقل تلقائيًا من localStorage عند أول تشغيل.
============================================================ */
const IDB_NAME = 'samgym_idb', IDB_STORE = 'kv';
let idbHandle = null;
const memKV = {};
let idbWarned = false;
function idbOpen(){
  return new Promise(res=>{
    try{
      if(!window.indexedDB){ res(null); return; }
      const r = indexedDB.open(IDB_NAME, 1);
      r.onupgradeneeded = ()=>{ try{ r.result.createObjectStore(IDB_STORE); }catch(e){} };
      r.onsuccess = ()=>res(r.result);
      r.onerror = ()=>res(null);
      r.onblocked = ()=>res(null);
    }catch(e){ res(null); }
  });
}
function idbGet(k){
  return new Promise(res=>{
    try{
      const rq = idbHandle.transaction(IDB_STORE,'readonly').objectStore(IDB_STORE).get(k);
      rq.onsuccess = ()=>res(rq.result);
      rq.onerror = ()=>res(undefined);
    }catch(e){ res(undefined); }
  });
}
function idbSet(k,v){
  return new Promise(res=>{
    try{
      const tx = idbHandle.transaction(IDB_STORE,'readwrite');
      tx.objectStore(IDB_STORE).put(v,k);
      tx.oncomplete = ()=>res(true);
      tx.onerror = tx.onabort = ()=>res(false);
    }catch(e){ res(false); }
  });
}
function idbDel(k){
  return new Promise(res=>{
    try{
      const tx = idbHandle.transaction(IDB_STORE,'readwrite');
      tx.objectStore(IDB_STORE).delete(k);
      tx.oncomplete = ()=>res(true);
      tx.onerror = tx.onabort = ()=>res(false);
    }catch(e){ res(false); }
  });
}
function persistKV(key, value){
  memKV[key] = value;
  if(!idbHandle){
    try{ localStorage.setItem(key, typeof value==='string' ? value : JSON.stringify(value)); return true; }
    catch(e){ console.error('persist failed', e); return false; }
  }
  idbSet(key, value).then(ok=>{
    if(!ok && !idbWarned){
      idbWarned = true;
      alert('تعذر حفظ البيانات في ذاكرة الجهاز. يرجى تصدير نسخة احتياطية من الإعدادات.');
    }
  });
  return true;
}
async function initStorage(){
  idbHandle = await idbOpen();
  if(!idbHandle) return;
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  for(const key of [DATA_KEY, DIET_KEY, BG_KEY, 'samgym_srv_state']){
    let v = await idbGet(key);
    if(v === undefined){
      let raw = null;
      try{ raw = localStorage.getItem(key); }catch(e){}
      if(raw !== null){
        let val = null;
        if(key === BG_KEY) val = raw;
        else { try{ val = JSON.parse(raw); }catch(e){ val = null; } }
        if(val !== null){
          const ok = await idbSet(key, val);
          if(ok){ v = val; try{ localStorage.removeItem(key); }catch(e){} }
        }
      }
    }
    if(v !== undefined) memKV[key] = v;
  }
}

let audioCtx = null;
function getAudioCtx(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(e){ return null; }
  }
  if(audioCtx.state === 'suspended'){ try{ const r = audioCtx.resume(); if(r && r.catch) r.catch(()=>{}); }catch(e){} }
  return audioCtx;
}
function playTone(freq, duration, type, startTime, volume){
 try{
  const ctx = getAudioCtx();
  if(!ctx) return;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type || 'sine';
  osc.frequency.value = freq;
  const vol = volume!==undefined ? volume : 0.12;
  osc.connect(gain);
  gain.connect(ctx.destination);
  const t0 = ctx.currentTime + (startTime||0);
  gain.gain.setValueAtTime(vol, t0);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0+duration);
  osc.start(t0);
  osc.stop(t0+duration+0.03);
 }catch(e){ /* a sound failure must never block the app */ }
}

/* ============================================================
   SERVER SYNC — phone + computer at the same time
   If the page is served by samgym-server, data is shared through the
   server (accounts + roles). Opened as a plain file, the app works
   exactly as before (local only).
============================================================ */
const SRV = { on:false, needsSetup:false, token:null, me:null, offset:0, cursor:0, init:false, shadow:{}, docHash:{},
              sent:{}, dirty:true, busy:false, again:false, force:false, timer:null, debounce:null, online:true };
const SRV_TOKEN_KEY='samgym_srv_token', SRV_ME_KEY='samgym_srv_me', SRV_STATE_KEY='samgym_srv_state';
const SRV_ROLE_LABEL = { owner:'مدير القاعة', reception:'موظف استقبال' };
function srvHash(o){            // cyrb53 over the JSON text
  const s = typeof o==='string' ? o : JSON.stringify(o);
  let h1=0xdeadbeef, h2=0x41c6ce57;
  for(let i=0;i<s.length;i++){ const c=s.charCodeAt(i); h1=Math.imul(h1^c,2654435761); h2=Math.imul(h2^c,1597334677); }
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (4294967296*(2097151&h2)+(h1>>>0)).toString(36);
}
function srvNow(){ return Date.now() + SRV.offset; }
function srvMarkDirty(){
  if(!SRV.on) return;
  SRV.dirty = true;
  clearTimeout(SRV.debounce);
  SRV.debounce = setTimeout(srvSync, 600);
}
function srvSaveState(){
  try{ persistKV(SRV_STATE_KEY, { cursor:SRV.cursor, init:SRV.init, shadow:SRV.shadow, docHash:SRV.docHash }); }catch(e){}
}
function srvLoadState(){
  let st = null;
  try{ st = memKV[SRV_STATE_KEY] || JSON.parse(localStorage.getItem(SRV_STATE_KEY)); }catch(e){}
  if(st){ SRV.cursor=st.cursor||0; SRV.init=!!st.init; SRV.shadow=st.shadow||{}; SRV.docHash=st.docHash||{}; }
}
async function srvApi(path, opts, timeout){
  opts = opts || {};
  const ctl = new AbortController(), to = setTimeout(()=>ctl.abort(), timeout||30000);
  try{
    const headers = { 'Content-Type':'application/json' };
    if(SRV.token) headers.Authorization = 'Bearer '+SRV.token;
    const r = await fetch(path, { method:opts.method||'GET', headers, body:opts.body?JSON.stringify(opts.body):undefined, signal:ctl.signal, cache:'no-store' });
    let j = null; try{ j = await r.json(); }catch(e){}
    return { status:r.status, ok:r.ok, json:j||{} };
  } finally { clearTimeout(to); }
}
async function srvDetect(){

}
/* ---- items <-> db/expenses/diet ---- */
function srvArr(c, g, create){
  if(c==='members') return create ? (db[g]||(db[g]=[])) : db[g];
  if(c==='expenses') return create ? (expenses[g]||(expenses[g]=[])) : expenses[g];
  return dietFiles;
}
function srvItems(){
  const m = new Map();
  for(const g in db) for(const o of (db[g]||[])) if(o && o.id) m.set('members|'+g+'|'+o.id, {c:'members',g,id:o.id,o});
  for(const g in expenses) for(const o of (expenses[g]||[])) if(o && o.id) m.set('expenses|'+g+'|'+o.id, {c:'expenses',g,id:o.id,o});
  for(const o of dietFiles) if(o && o.id) m.set('diet||'+o.id, {c:'diet',g:'',id:o.id,o});
  return m;
}
function srvDiff(){
  const cur = srvItems(), out = [], ts = srvNow();
  for(const [k,v] of cur){
    const str = JSON.stringify(v.o), h = srvHash(str);
    if(SRV.shadow[k] !== h) out.push({ k, h, c:v.c, g:v.g, id:v.id, ts, del:false, data:v.o, size:str.length });
  }
  for(const k in SRV.shadow) if(!cur.has(k)){
    const a = k.indexOf('|'), b = k.indexOf('|', a+1);
    out.push({ k, h:null, c:k.slice(0,a), g:k.slice(a+1,b), id:k.slice(b+1), ts, del:true, data:null, size:50 });
  }
  return out;
}
function srvApplyItem(r, touched){
  const k = r.c+'|'+r.g+'|'+r.id;
  const arr = srvArr(r.c, r.g, true);
  const idx = arr.findIndex(o=>o && o.id===r.id);
  if(r.del){
    if(idx>-1){
      const lh = srvHash(arr[idx]);
      if(!(SRV.force || lh===SRV.shadow[k] || lh===SRV.sent[k])) return;
      arr.splice(idx,1); touched[r.c]=true;
    }
    delete SRV.shadow[k];
    return;
  }
  const nh = srvHash(r.data);
  if(idx>-1){
    const lh = srvHash(arr[idx]);
    if(lh===nh){ SRV.shadow[k]=nh; return; }
    if(!SRV.force && lh!==SRV.shadow[k] && lh!==SRV.sent[k]) return;   // local edit not yet sent: keep it
    arr[idx] = r.data;
  } else arr.push(r.data);
  SRV.shadow[k] = nh; touched[r.c] = true;
}
function srvRemoveLocal(k){
  const a = k.indexOf('|'), b = k.indexOf('|', a+1);
  const c = k.slice(0,a), g = k.slice(a+1,b), id = k.slice(b+1);
  const arr = srvArr(c, g, false); if(!arr) return;
  const i = arr.findIndex(o=>o && o.id===id); if(i>-1) arr.splice(i,1);
  delete SRV.shadow[k];
}
let srvWarnedRejected = false;
function srvApply(resp, sentItems, plansSent){
  SRV.offset = resp.now - Date.now();
  const rej = new Set(resp.rejected||[]);
  SRV.sent = {};
  for(const it of sentItems) SRV.sent[it.k] = it.h;
  for(const it of sentItems){
    if(rej.has(it.k)) continue;
    if(it.del) delete SRV.shadow[it.k]; else SRV.shadow[it.k] = it.h;
  }
  const touched = {};
  for(const r of (resp.items||[])) srvApplyItem(r, touched);
  if(resp.docs && resp.docs.plans){
    const ph = srvHash(SUBSCRIPTION_PLANS);
    if(SRV.force || SRV.docHash.plans===undefined || ph===SRV.docHash.plans){
      SUBSCRIPTION_PLANS = resp.docs.plans.data;
      try{ localStorage.setItem(PLANS_KEY, JSON.stringify(SUBSCRIPTION_PLANS)); }catch(e){}
      SRV.docHash.plans = srvHash(SUBSCRIPTION_PLANS); touched.plans = true;
    }
  }
  if(plansSent && !rej.has('doc|plans')) SRV.docHash.plans = plansSent;
  if(touched.members) persistKV(DATA_KEY, db);
  if(touched.expenses){ try{ localStorage.setItem(EXPENSES_KEY, JSON.stringify(expenses)); }catch(e){} }
  if(touched.diet) persistKV(DIET_KEY, dietFiles);
  if(rej.size){
    for(const it of sentItems) if(rej.has(it.k) && !it.del) srvRemoveLocal(it.k);
    if(rej.has('doc|plans')) SRV.docHash.plans = srvHash(SUBSCRIPTION_PLANS);
    SRV.cursor = 0; SRV.force = true;                 // next cycle restores the server's version
    if(!srvWarnedRejected){ srvWarnedRejected = true; alert('بعض التغييرات لم تُحفظ لأن صلاحيات حسابك لا تسمح بها.'); }
  } else SRV.cursor = resp.cursor;
  if(resp.user && srvUpdateMe(resp.user)) { SRV.cursor = 0; SRV.force = true; }   // gained access to new data: fetch it
  srvSaveState();
  if(Object.keys(touched).length) srvRefreshUI();
}
function srvRefreshUI(){
  try{ if(!document.getElementById('app').classList.contains('hidden')) render(); }catch(e){}
}
async function srvPost(body){
  const r = await srvApi('api/sync', { method:'POST', body }, 120000);
  if(r.status===401){ const e = new Error('unauth'); e.unauth = true; throw e; }
  if(!r.ok) throw new Error('sync '+r.status);
  /* الخادم أُعيد إنشاؤه أو فُقدت بياناته (رقم المزامنة عنده أصغر مما نعرفه): أعد رفع كل بيانات هذا الجهاز */
  if(r.json && typeof r.json.cursor==='number' && typeof body.since==='number' && r.json.cursor < body.since){
    SRV.shadow = {}; SRV.cursor = 0; SRV.init = false; SRV.force = false; SRV.dirty = true; srvSaveState();
    throw new Error('server reset');
  }
  return r.json;
}
async function srvSync(){
  if(!SRV.on || !SRV.token) return;
  if(SRV.busy){ SRV.again = true; return; }
  SRV.busy = true; srvBadge('sync');
  const forcing = SRV.force;
  try{
    let changes = [];
    if(SRV.dirty){
      SRV.dirty = false;
      changes = srvDiff();
      const dels = changes.filter(c=>c.del).length, known = Object.keys(SRV.shadow).length;
      if(dels>5 && dels>known*0.3){
        if(!confirm('تم حذف '+dels+' عنصرا من هذا الجهاز دفعة واحدة.\nموافق = حذفها نهائيا من الخادم أيضا.\nإلغاء = استعادة البيانات من الخادم.')){
          SRV.shadow = {}; SRV.cursor = 0; SRV.init = false; SRV.force = true; changes = [];
        }
      }
    }
    let docsOut, plansSent = null;
    if(SRV.me && SRV.me.role==='owner'){
      const ph = srvHash(SUBSCRIPTION_PLANS);
      if(ph !== SRV.docHash.plans){ docsOut = { plans:{ ts:srvNow(), data:SUBSCRIPTION_PLANS } }; plansSent = ph; }
    }
    const batches = []; let cur = [], size = 0;
    for(const ch of changes){
      if(cur.length && size+ch.size > 3e6){ batches.push(cur); cur=[]; size=0; }
      cur.push(ch); size += ch.size;
    }
    batches.push(cur);
    for(let i=0;i<batches.length;i++){
      const items = batches[i];
      let resp = await srvPost({ since:SRV.cursor, init:!SRV.init, docs:i===0?docsOut:undefined,
        items: items.map(({c,g,id,ts,del,data})=>({c,g,id,ts,del,data})) });
      srvApply(resp, items, i===0 ? plansSent : null);
      while(resp.more){ resp = await srvPost({ since:SRV.cursor, init:false, items:[] }); srvApply(resp, [], null); }
    }
    SRV.init = true; if(forcing) SRV.force = false;
    srvSaveState(); SRV.online = true; srvBadge('ok');
  }catch(e){
    SRV.dirty = true;
    if(e && e.unauth){ srvForceLogin('انتهت الجلسة أو تم تعطيل الحساب، يرجى تسجيل الدخول من جديد.'); }
    else { SRV.online = false; srvBadge('off'); }
  }finally{
    SRV.busy = false;
    if(SRV.again){ SRV.again = false; setTimeout(srvSync, 200); }
  }
}

function attemptLogin(){
  if(SRV.on){ srvLogin(); return; }
  if(settings.loginPasswordEnabled !== true){
    sessionStorage.setItem(SESSION_KEY, '1');
    showApp();
    return;
  }
  const val = document.getElementById('loginPassInput').value;
  if(val === settings.loginPassword){
    sessionStorage.setItem(SESSION_KEY, '1');
    playSuccessSound();
    showApp();
  } else {
    playErrorSound();
    document.getElementById('loginErr').textContent = 'كلمة المرور غير صحيحة';
  }
}
document.addEventListener('DOMContentLoaded', async ()=>{
  await initStorage();
  loadTheme();
  loadCustomBackground();
  loadAll();
  applyAppName();
  applyAppLogo();
  loadLanguage();
  startAutoBackup();
  await srvDetect();
  if(SRV.on){
    await srvBoot();
    return;

      document.getElementById('firstRunNote').textContent = 'كلمة المرور الافتراضية: 1234 — يرجى تغييرها من الإعدادات بعد الدخول.';

});
/* الضغط على Enter في شاشة الدخول يفتح البرنامج (من أي مكان، دون الحاجة للنقر على الزر) */
document.addEventListener('keydown', function(e){
  if(e.key !== 'Enter' || e.isComposing) return;
  const ls = document.getElementById('loginScreen');
  if(!ls || ls.classList.contains('hidden')) return;
  const mr = document.getElementById('modalRoot');

  e.preventDefault();

  if(u && uf && !uf.classList.contains('hidden') && !u.value.trim()){ u.focus(); return; }

/* ============================================================
   CUSTOM PROFESSIONAL DROPDOWNS (skin over the real <select>s so
   all existing filter/month logic keeps working untouched)
============================================================ */
function buildCustomSelectMenu(nativeId){
  const native = document.getElementById(nativeId);
  const menu = document.getElementById('cselMenu-'+nativeId);
  const label = document.getElementById('cselLabel-'+nativeId);
  if(!native || !menu) return;
  const options = Array.from(native.options);
  menu.innerHTML = options.map(o=>`
    <div class="csel-option ${o.value===native.value?'selected':''}" onclick="selectCustomOption('${nativeId}','${o.value.replace(/'/g,"\\'")}')">
      <span>${escapeHtml(o.textContent)}</span>
      <span class="chk">✓</span>
    </div>`).join('');
  const selected = options.find(o=>o.value===native.value);
  if(label) label.textContent = selected ? selected.textContent : (options[0] ? options[0].textContent : '—');
}
function toggleCustomSelect(nativeId){
  const wrap = document.getElementById('cselWrap-'+nativeId);
  if(!wrap) return;
  const wasOpen = wrap.classList.contains('open');
  closeAllCustomSelects();
  if(!wasOpen){
    buildCustomSelectMenu(nativeId);
    wrap.classList.add('open');
    const sel = wrap.querySelector('.csel-option.selected');
    if(sel) sel.scrollIntoView({block:'nearest'});
  }
}
function closeAllCustomSelects(){
  document.querySelectorAll('.csel.open').forEach(w=>w.classList.remove('open'));
}
function selectCustomOption(nativeId, value){
  const native = document.getElementById(nativeId);
  if(!native) return;
  native.value = value;
  native.dispatchEvent(new Event('change'));
  buildCustomSelectMenu(nativeId);
  closeAllCustomSelects();
}
document.addEventListener('click', (e)=>{
  if(!e.target.closest('.csel')) closeAllCustomSelects();
});

  render();
}

/* ============================================================
   STATUS / DATE HELPERS
============================================================ */
function parseLocalDate(str){
  const p = String(str).slice(0,10).split('-').map(Number);
  return new Date(p[0], p[1]-1, p[2]);
}
function toLocalISO(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function todayLocalISO(){ return toLocalISO(new Date()); }
function defaultStartDateForSelectedMonth(){
  const now = new Date();
  if(state.year===now.getFullYear() && state.month===now.getMonth()) return todayLocalISO();
  return state.year+'-'+String(state.month+1).padStart(2,'0')+'-01';
}
function addDays(dateStr, days){
  const d = parseLocalDate(dateStr);
  d.setDate(d.getDate()+days);
  return toLocalISO(d);
}
function daysDiffFromToday(dateStr){
  const today = new Date(); today.setHours(0,0,0,0);
  const target = parseLocalDate(dateStr);
  return Math.round((target-today)/86400000);
}
function statusOf(member){
  const diff = daysDiffFromToday(member.endDate);
  if(diff < 0) return member.renewed ? 'renewed' : 'expired';
  if(diff <= 3) return 'soon';
  return 'active';
}
const FILE_TXT = {
  ar:{ask:'أحضر الملف', yes:'📁 أحضر الملف', no:'⚠️ لم يحضر الملف', detail:'الملف'},
  fr:{ask:'A apporté le dossier', yes:'📁 Dossier apporté', no:'⚠️ Dossier non apporté', detail:'Dossier'},
  en:{ask:'Brought the file', yes:'📁 File brought', no:'⚠️ File not brought', detail:'File'}
};
function fileLabel(k){ return (FILE_TXT[currentLang]||FILE_TXT.ar)[k]; }
function fileChip(m){
  return m.fileBrought
    ? `<span class="file-chip yes">${fileLabel('yes')}</span>`
    : `<span class="file-chip no">${fileLabel('no')}</span>`;
}
function statusLabel(s){ return s==='active'?t('activeLabel'):(s==='soon'?t('soonLabelFull'):(s==='renewed'?t('renewedLabel'):t('expiredLabel'))); }
function fmtDate(d){ return d ? parseLocalDate(d).toLocaleDateString('en-GB') : '—'; }

/* ============================================================
   RENDER
============================================================ */
function render(){
  const members = currentMembers();
  // counters
  let active=0, soon=0, expired=0;
  members.forEach(m=>{ const s=statusOf(m); if(s==='active')active++; else if(s==='soon')soon++; else if(s==='expired')expired++; });
  document.getElementById('cntTotal').textContent = members.length;
  document.getElementById('cntActive').textContent = active;
  document.getElementById('cntSoon').textContent = soon;
  document.getElementById('cntExpired').textContent = expired;
  const _bc = document.getElementById('membersBigCount'); if(_bc) _bc.textContent = members.length;

  // filter/search
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const filter = document.getElementById('statusFilter').value;
  const subFilter = document.getElementById('subTypeFilter') ? document.getElementById('subTypeFilter').value : 'all';
  let list = members.filter(m=>{
    const s = statusOf(m);
    const matchesQ = !q || (m.firstName+' '+m.lastName).toLowerCase().includes(q);
    let matchesF = true;
    if(filter==='debt') matchesF = Number(m.remaining||0) > 0;
    else if(filter!=='all') matchesF = s===filter;
    const matchesSub = subFilter==='all' || m.subType===subFilter;
    return matchesQ && matchesF && matchesSub;
  });

  const listEl = document.getElementById('membersList');
  if(list.length===0){
    listEl.innerHTML = `<div class="empty-state">لا يوجد مشتركون مطابقون لهذا الشهر أو البحث 🏋️</div>`;
    return;
  }
  listEl.innerHTML = list.map(m=>{
    const s = statusOf(m);
    const avatar = m.photo ? `<img class="avatar" src="${m.photo}">` : `<div class="avatar avatar-placeholder">🏋️</div>`;
    const debtChip = Number(m.remaining||0)>0 ? `<span class="debt-chip">${t('debtShort')}: ${Number(m.remaining).toLocaleString()} ${t('currencyDA')}</span>` : '';
    const plan = planById(m.subType);
    const endLine = s==='renewed' ? `<span style="color:var(--green); font-weight:700;">${t('renewedLabel')}</span>` : s==='expired' ? `<span style="color:var(--red); font-weight:700;">${t('subEndedLabel')}</span>` : `<svg class="ico" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/></svg> ${t('endsLabel')}: ${fmtDate(m.endDate)}`;
    return `
      <div class="member-row" onclick="openDetail('${m.id}')">
        ${avatar}
        <div class="m-info">
          <div class="m-name">${escapeHtml(m.firstName)} ${escapeHtml(m.lastName)}</div>
          <div class="m-plan">${planLabel(plan)}</div>
          <div class="m-sub"><span>${endLine}</span></div>
          <div class="m-chips">${m.notifiedAt?`<span class="wa-done-chip" title="${fmtDate(m.notifiedAt)}">${t('notifiedLabel')}</span>`:''}${debtChip}${fileChip(m)}</div>
        </div>
        <div class="status-dot ${s}" title="${statusLabel(s)}"></div>
      </div>`;
  }).join('');
}

const MP_IDLE_MS = 2*60*1000;   // إغلاق تلقائي بعد دقيقتين دون استعمال
let mpIdleTimer = null;
function mpResetIdle(){
  clearTimeout(mpIdleTimer); mpIdleTimer = null;
  const mp = document.getElementById('membersPage');
  if(!mp || mp.classList.contains('hidden')) return;
  mpIdleTimer = setTimeout(()=>{
    const m = document.getElementById('membersPage');
    if(!m || m.classList.contains('hidden')) return;
    const mr = document.getElementById('modalRoot');
    if(mr && mr.innerHTML.trim() !== ''){ mpResetIdle(); return; }   // نافذة مفتوحة: أعد العدّ
    closeMembersPage();
  }, MP_IDLE_MS);
}
['pointerdown','touchstart','keydown','wheel','scroll','input','click'].forEach(ev=>
  document.addEventListener(ev, ()=>{ if(mpIdleTimer!==null) mpResetIdle(); }, {capture:true, passive:true}));
function openMembersPageNow(){
  const hv = document.getElementById('homeView'), mp = document.getElementById('membersPage');
  if(hv) hv.classList.add('hidden');          // إخفاء الصفحة الرئيسية بالكامل

  try{ render(); }catch(e){}
  try{ window.scrollTo(0,0); }catch(e){}
  pushBackGuard();                            // زر الرجوع في الهاتف يعيد إلى الصفحة الرئيسية
  mpResetIdle();
}
function closeMembersPage(){
  const hv = document.getElementById('homeView'), mp = document.getElementById('membersPage');
  clearTimeout(mpIdleTimer); mpIdleTimer = null;
  if(mp) mp.classList.add('hidden');
  if(hv) hv.classList.remove('hidden');

}

let expState = { period: 'month', y: null, m: null };
function expEnsureDate(){ if(expState.y===null || expState.m===null){ expState.y = state.year; expState.m = state.month; } }

function monthKeysBack(refYear, refMonth, n){
  const keys = [];
  let y = refYear, m = refMonth;
  for(let i=0; i<n; i++){
    keys.push(monthKey(y,m));
    m--;
    if(m<0){ m=11; y--; }
  }
  return keys;
}
function incomeForMonth(key){
  const members = db[key] || [];
  return members.reduce((s,m)=>s+Number(m.amountPaid||0),0);
}
function expensesForMonth(key){
  const list = expenses[key] || [];
  return list.reduce((s,e)=>s+Number(e.price||0),0);
}
function statsForPeriod(period){
  const n = period==='month' ? 1 : (period==='q3' ? 3 : (period==='q6' ? 6 : 12));
  expEnsureDate();
  const keys = monthKeysBack(expState.y, expState.m, n);
  let income=0, expense=0, debt=0;
  keys.forEach(k=>{ income += incomeForMonth(k); expense += expensesForMonth(k); debt += (db[k]||[]).reduce((x,m)=>x+Number(m.remaining||0),0); });
  return { income, expense, debt, net: income-expense, keys };
}
function periodLabel(period){
  const s = statsForPeriod(period);
  const keys = [...s.keys].reverse(); // oldest -> newest
  const fmt = k=>{ const [y,m] = k.split('-'); return monthNames()[parseInt(m,10)-1] + ' ' + y; };
  if(keys.length===1) return fmt(keys[0]);
  return fmt(keys[0]) + ' ← ' + fmt(keys[keys.length-1]);
}

function formatFileSize(bytes){
  if(!bytes) return '';
  if(bytes < 1024) return bytes + ' B';
  if(bytes < 1024*1024) return Math.round(bytes/1024) + ' KB';
  return (bytes/(1024*1024)).toFixed(1) + ' MB';
}
function dataUrlSizeBytes(dataUrl){
  const idx = dataUrl.indexOf(',');
  const base64 = idx>-1 ? dataUrl.slice(idx+1) : dataUrl;
  return Math.round(base64.length * 3 / 4);
}
function handleDietUpload(e){
  const files = Array.from(e.target.files || []);
  const err = document.getElementById('dietErr');
  if(err) err.textContent = '';
  if(!files.length) return;

  const readOne = (file)=> new Promise((resolve)=>{
    const isImage = file.type.startsWith('image/');
    const reader = new FileReader();
    reader.onload = ()=>{
      const rawDataUrl = reader.result;
      if(isImage){
        compressImageSrc(rawDataUrl, 1000, 0.8)
          .then(compressed=> resolve({ name:file.name, mime:'image/jpeg', data:compressed, isImage:true }))
          .catch(()=> resolve({ name:file.name, mime:file.type, data:rawDataUrl, isImage:true }));
      } else {
        resolve({ name:file.name, mime:file.type || 'application/octet-stream', data:rawDataUrl, isImage:false });
      }
    };
    reader.onerror = ()=> resolve(null);
    reader.readAsDataURL(file);
  });

  Promise.all(files.map(readOne)).then(results=>{
    const before = dietFiles.slice();
    results.filter(Boolean).forEach(r=>{
      dietFiles.push({ id:'d'+Date.now()+Math.random().toString(36).slice(2,7), name:r.name, mime:r.mime, data:r.data, isImage:r.isImage, addedAt:new Date().toISOString() });
    });
    const ok = saveDietFiles();
    if(!ok){
      dietFiles = before; // rollback
      if(err) err.textContent = t('dietSaveErr');
    }
    e.target.value = '';
    renderDietFilesList();
  });
}
function dietExt(f){
  const m = (f.name||'').match(/\.([a-z0-9]+)$/i);
  const ext = m ? m[1].toUpperCase() : '';
  if(ext) return ext.slice(0,4);
  return (f.mime||'').includes('pdf') ? 'PDF' : 'FILE';
}

function deleteDietFile(id){
  const idx = dietFiles.findIndex(f=>f.id===id);
  if(idx>-1){ dietFiles.splice(idx,1); saveDietFiles(); renderDietFilesList(); }
}
function downloadDietFile(file){
  // Uses a Blob object URL (not a raw data URL) so the download is
  // reliable on desktop browsers too.
  try{
    const blobFile = dataUrlToFile(file.data, file.name, file.mime);
    const objectUrl = URL.createObjectURL(blobFile);
    const a = document.createElement('a');
    a.href = objectUrl; a.download = file.name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=> URL.revokeObjectURL(objectUrl), 10000);
  }catch(e){
    // Fallback: download straight from the stored data URL.
    const a = document.createElement('a');
    a.href = file.data; a.download = file.name;
    document.body.appendChild(a); a.click(); a.remove();
  }
}

function dataUrlToFile(dataUrl, filename, mime){

  while(n--){ u8arr[n] = bstr.charCodeAt(n); }
  return new File([u8arr], filename, { type: mime });
}

function setupAddFormKeyNav(){
  const modal = document.querySelector('.modal-add');
  if(!modal) return;
  const getEls = ()=>Array.from(modal.querySelectorAll('#fFirst,#fLast,#fPhone,#cselWrap-fSubType .csel-btn,#fStart,#fAmount,#addSubmitBtn')).filter(e=>!e.disabled);
  const go = (el)=>{
    if(!el) return;
    el.focus();
    try{ if(el.tagName==='INPUT' && (el.type==='text'||el.type==='number')) el.select(); }catch(_){}
  };
  modal.addEventListener('keydown', e=>{
    if(e.isComposing) return;
    const k = e.key;
    if(k!=='Enter' && k!=='ArrowDown' && k!=='ArrowUp') return;
    const els = getEls();
    const i = els.indexOf(document.activeElement);
    if(i<0) return;
    const el = els[i];
    const isBtn = el.tagName==='BUTTON';
    const isSubmit = el.id==='addSubmitBtn';
    const isCsel = el.classList.contains('csel-btn');
    const isTextLike = el.tagName==='INPUT' && el.type==='text';
    if(isSubmit){
      if(k==='ArrowUp'){ e.preventDefault(); go(els[i-1]); }
      return; // Enter على زر الحفظ ينفّذ الحفظ طبيعيًا
    }
    if(isCsel){
      if(k==='ArrowDown' || k==='ArrowUp'){
        e.preventDefault();
        const nat = document.getElementById('fSubType');
        let n = nat.selectedIndex + (k==='ArrowDown' ? 1 : -1);
        n = Math.max(0, Math.min(nat.options.length-1, n));
        nat.selectedIndex = n;
        nat.dispatchEvent(new Event('change'));
        buildCustomSelectMenu('fSubType');
      } else { // Enter
        e.preventDefault();
        closeAllCustomSelects();
        go(els[i+1]);
      }
      return;
    }
    if(k==='Enter'){ e.preventDefault(); go(els[i+1]); return; }
    // الأسهم: للحقول النصية فقط (حقل التاريخ والرقم تستعمل الأسهم لتغيير القيمة)
    if(isTextLike){
      e.preventDefault();
      go(k==='ArrowDown' ? els[i+1] : els[i-1]);
    }
  });
  if(!('ontouchstart' in window)){ const f = document.getElementById('fFirst'); if(f) f.focus(); }
}

/* Resize + compress any image (file or dataURL) so member photos never
   overflow localStorage. Max dimension 480px, JPEG quality .75. */
function compressImageSrc(src, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    img.onload = ()=>{
      let { width, height } = img;
      if(width > height && width > maxDim){ height = Math.round(height*(maxDim/width)); width = maxDim; }
      else if(height > maxDim){ width = Math.round(width*(maxDim/height)); height = maxDim; }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img,0,0,width,height);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = reject;
    img.src = src;
  });
}
/* صورة المشترك: تملأ الإطار كاملا (مربع 512×512، قص مركزي مع ميل للأعلى للوجوه) بدون أي كتابة أو شعار */
function brandPhoto(src){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    img.onerror = reject;
    img.onload = ()=>{
      try{
        const W = 512, c = document.createElement('canvas'); c.width = W; c.height = W;
        const g = c.getContext('2d'), side = Math.min(img.width, img.height);
        const sx = (img.width - side)/2, sy = (img.height - side)*0.2;
        g.fillStyle = '#111'; g.fillRect(0, 0, W, W);
        g.drawImage(img, sx, sy, side, side, 0, 0, W, W);
        resolve(c.toDataURL('image/jpeg', .85));
      }catch(e){ reject(e); }
    };
    img.src = src;
  });
}
function handlePhotoUpload(e){

function readFormat(g,dim){
  var a=0,b=0,i;

  for(i=9;i<15;i++) p1.push([14-i,8]);
  for(i=0;i<15;i++) if(g[p1[i][1]*dim+p1[i][0]]) a|=1<<i;
  for(i=0;i<8;i++) if(g[8*dim+(dim-1-i)]) b|=1<<i;
  for(i=8;i<15;i++) if(g[(dim-15+i)*dim+8]) b|=1<<i;

/* ---------- قناع الوحدات الوظيفية ---------- */
function funcMask(V){
  var dim=17+4*V, m=new Uint8Array(dim*dim), i, j;
  function setR(x0,y0,w,h){ for(var y=y0;y<y0+h;y++) for(var x=x0;x<x0+w;x++) m[y*dim+x]=1; }
  setR(0,0,9,9); setR(dim-8,0,8,9); setR(0,dim-8,9,8);
  for(i=0;i<dim;i++){ m[6*dim+i]=1; m[i*dim+6]=1; }
  var a=AP[V-1];
  for(i=0;i<a.length;i++) for(j=0;j<a.length;j++){
    if((i===0&&j===0)||(i===0&&j===a.length-1)||(i===a.length-1&&j===0)) continue;
    setR(a[i]-2,a[j]-2,5,5);
  }
  if(V>=7){ setR(dim-11,0,3,6); setR(0,dim-11,6,3); }

}
function maskBit(k,y,x){
  switch(k){
    case 0: return (y+x)%2===0;
    case 1: return y%2===0;
    case 2: return x%3===0;
    case 3: return (y+x)%3===0;
    case 4: return (((y>>1)+Math.floor(x/3))%2)===0;
    case 5: return ((y*x)%2+(y*x)%3)===0;
    case 6: return (((y*x)%2+(y*x)%3)%2)===0;
    default: return (((y+x)%2+(y*x)%3)%2)===0;
  }
}

  function rd(n){ var v=0; for(var i=0;i<n;i++){ v=(v<<1)|((d[pos>>3]>>(7-(pos&7)))&1); pos++; } return v; }

    var n, i;
    if(mode===1){

      while(n>=3){ out+=('00'+rd(10)).slice(-3); n-=3; }
      if(n===2) out+=('0'+rd(7)).slice(-2); else if(n===1) out+=String(rd(4));

      n=rd([9,11,13][cc]);

  var fm=funcMask(V), bits=[], up=true, x, k, c, y;
  for(x=dim-1;x>0;x-=2){

    for(k=0;k<dim;k++){

      for(c=0;c<2;c++){

        bits.push(bit);

  var p=0;
  for(i=0;i<maxD;i++) for(j=0;j<blocks.length;j++) if(i<blocks[j].d) blocks[j].w.push(cw[p++]);
  var ecn=blocks[0].t-blocks[0].d;
  for(i=0;i<ecn;i++) for(j=0;j<blocks.length;j++) blocks[j].w.push(cw[p++]);

      var x0=Math.max(0,x-half), x1=Math.min(w,x+half+1);

    }

      var m=ratio(L5); if(!m) continue;
      var cx=Math.round(starts[r+2]+(lens[r+2]-1)/2);
      var v=check(cx,y,0,1); if(!v) continue;
      var cy=Math.round(y+v.off);

      var fx=cx+hh.off, fy=y+v.off, mm=(m+v.m+hh.m)/3, found=false;
