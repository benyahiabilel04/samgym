/* تحويل المنظور من 4 نقاط */
function homography(src,dst){
  var A=[], i, j, k;
  for(i=0;i<4;i++){
    var u=src[i][0], v=src[i][1], x=dst[i][0], y=dst[i][1];
    A.push([u,v,1,0,0,0,-x*u,-x*v,x]); A.push([0,0,0,u,v,1,-y*u,-y*v,y]);
  }
  for(i=0;i<8;i++){
    var piv=i; for(j=i+1;j<8;j++) if(Math.abs(A[j][i])>Math.abs(A[piv][i])) piv=j;
    if(Math.abs(A[piv][i])<1e-10) return null;
    var t=A[i]; A[i]=A[piv]; A[piv]=t;
    for(j=0;j<8;j++){ if(j===i) continue; var f=A[j][i]/A[i][i]; for(k=i;k<9;k++) A[j][k]-=f*A[i][k]; }
  }
  var h=[]; for(i=0;i<8;i++) h.push(A[i][8]/A[i][i]);
  return function(u,v){ var d=h[6]*u+h[7]*v+1; return [(h[0]*u+h[1]*v+h[2])/d,(h[3]*u+h[4]*v+h[5])/d]; };
}
function dist(a,b){ return Math.sqrt((a.x-b.x)*(a.x-b.x)+(a.y-b.y)*(a.y-b.y)); }

  var c=T(dim-6.5,dim-6.5), ex=T(dim-5.5,dim-6.5), ey=T(dim-6.5,dim-5.5);
  var exv=[ex[0]-c[0],ex[1]-c[1]], eyv=[ey[0]-c[0],ey[1]-c[1]];
  var ms=Math.sqrt(exv[0]*exv[0]+exv[1]*exv[1]), R=Math.ceil(ms*4), best=-1, sx=0, sy=0, cnt=0;
  for(var py=Math.round(c[1])-R;py<=Math.round(c[1])+R;py++){
    for(var px=Math.round(c[0])-R;px<=Math.round(c[0])+R;px++){
      var sc=0;
      for(var j=-2;j<=2;j++) for(var i=-2;i<=2;i++){
        var X=Math.round(px+i*exv[0]+j*eyv[0]), Y=Math.round(py+i*exv[1]+j*eyv[1]);
        var v=(X>=0&&Y>=0&&X<w&&Y<h)?bin[Y*w+X]:0;
        var want=(Math.max(Math.abs(i),Math.abs(j))===2||(i===0&&j===0))?1:0;
        if(v===want) sc++;
      }
      if(sc>best){ best=sc; sx=px; sy=py; cnt=1; }
      else if(sc===best){ sx+=px; sy+=py; cnt++; }
    }

    var votes=0;
    for(var k=0;k<5;k++){
      var p=T(c+0.5+off[k][0],r+0.5+off[k][1]), X=Math.round(p[0]), Y=Math.round(p[1]);
      if(X>=0&&Y>=0&&X<w&&Y<h&&bin[Y*w+X]) votes++;

function tryTriple(bin,w,h,TL,TR,BL){

  for(var oi=0;oi<order.length;oi++){
    var V=order[oi]; if(V<1||V>40) continue;
    var dim=17+4*V, br=[TR.x+BL.x-TL.x,TR.y+BL.y-TL.y];
    var Tp=homography([[3.5,3.5],[dim-3.5,3.5],[3.5,dim-3.5],[dim-3.5,dim-3.5]],[[TL.x,TL.y],[TR.x,TR.y],[BL.x,BL.y],br]);

  m.textContent = text; m.className = 'qrs-msg' + (kind ? ' '+kind : '');
  clearTimeout(qrMsgTimer);
  if(kind) qrMsgTimer = setTimeout(() => { const e = document.getElementById('qrScanMsg'); if(e){ e.textContent = t('scanQrHint'); e.className = 'qrs-msg'; } }, 3500);
}
function qrOnText(txt){
  const now = Date.now(); if(txt === qrLast.t && now - qrLast.at < 3500) return; qrLast = { t:txt, at:now };
  const q = qrParse(txt);
  if(!q){ qrMsg(t('scanQrUnknown'), 'err'); playErrorSound(); return; }
  const o = qrFind(q);
  if(!o){ qrMsg(t('scanQrNotFound'), 'err'); playErrorSound(); return; }
  closeQrScan();
  if(o.mk !== currentKey()){          // اشتراكه الأحدث في شهر آخر: ننتقل إليه ثم نفتح البطاقة
    const [y, m] = o.mk.split('-').map(Number); state.year = y; state.month = m-1;
    const ms = document.getElementById('monthSelect'), ys = document.getElementById('yearSelect');
    if(ms){ ms.value = state.month; buildCustomSelectMenu('monthSelect'); }
    if(ys){ ys.value = state.year; buildCustomSelectMenu('yearSelect'); }
    render();
  }
  openDetail(o.rec.id);
  if(statusOf(o.rec) === 'expired') playErrorSound(); else playSuccessSound();
}
function qrLoop(){
  if(!qrRun) return;
  const v = document.getElementById('qrScanVideo');
  if(!v){ qrRun = false; return; }
  if(v.readyState >= 2 && v.videoWidth > 0){
    const cw = Math.min(v.videoWidth, 1024), ch = Math.round(v.videoHeight*cw/v.videoWidth);
    if(!qrCanvas) qrCanvas = document.createElement('canvas');
    if(qrCanvas.width !== cw || qrCanvas.height !== ch){ qrCanvas.width = cw; qrCanvas.height = ch; }
    const cx = qrCanvas.getContext('2d', { willReadFrequently:true });
    cx.drawImage(v, 0, 0, cw, ch);
    let txt = null; try{ txt = window.SamQR.scan(cx.getImageData(0, 0, cw, ch)); }catch(e){}
    if(txt){ qrOnText(txt); if(!qrRun) return; }
  }
  setTimeout(qrLoop, 110);
}
async function qrOpenStream(low){
  const live = qrStream && qrStream.getTracks().some(x => x.readyState === 'live');
  if(live) return;
  let dev = ''; try{ dev = localStorage.getItem('samgym_qr_cam') || ''; }catch(e){}
  const base = low ? { width:{ ideal:960 }, height:{ ideal:540 }, frameRate:{ ideal:10, max:15 } } : { width:{ ideal:1280 }, height:{ ideal:720 } };
  try{
    qrStream = await navigator.mediaDevices.getUserMedia({ video: dev ? Object.assign({ deviceId:{ exact:dev } }, base) : base, audio:false });
  }catch(e){
    if(!dev) throw e;
    try{ localStorage.removeItem('samgym_qr_cam'); }catch(_){}
    qrStream = await navigator.mediaDevices.getUserMedia({ video: base, audio:false });
  }
}

        <div class="form-grid">

    v.srcObject = qrStream; try{ await v.play(); }catch(e){}

      sel.classList.remove('hidden');

      };
    }
    qrRun = true; qrLoop();
  }catch(err){
    let msg = t('scanQrNoCam');
    if(err && err.name === 'NotAllowedError') msg = t('scanQrDenied');
    if(err && err.name === 'NotFoundError') msg = t('scanQrNone');

}
function closeQrScan(){

  qrIdleTimer = setTimeout(() => { if(qrStream && !aqEnabled()){ qrStream.getTracks().forEach(x => x.stop()); qrStream = null; } }, 120000);   // نترك الكاميرا مفتوحة قليلا ليكون الفتح التالي فوريا
  const o = document.getElementById('qrScanOverlay'); if(o) o.remove();

/* ============================================================
   مسح QR تلقائي بالكاميرا في الصفحة الرئيسية (بدون فتح زر QR)
   خفيف على الحاسوب: دقة منخفضة، كشف حركة صغير، فك الترميز فقط عند الحاجة،
   ويتوقف تماما عند فتح أي نافذة أو إخفاء البرنامج.
============================================================ */
const AQ_KEY = 'samgym_autoqr_v1';
let aqTimer = null, aqVideo = null, aqSm = null, aqCv = null, aqPrev = null, aqState = '', aqOpening = false;
let aqLastDecode = 0, aqMotionUntil = 0, aqBlockedUntil = 0, aqPausedSince = 0, aqRetryAt = 0;
function aqEnabled(){ try{ return localStorage.getItem(AQ_KEY) === '1'; }catch(e){ return false; } }   // معطّل افتراضيا، يُفعَّل من الشارة أو من الإعدادات
function aqSetEnabled(v){
  try{ localStorage.setItem(AQ_KEY, v ? '1' : '0'); }catch(e){}
  aqRetryAt = 0; aqState = '';
  const c = document.getElementById('autoQrChk'); if(c) c.checked = !!v;
  if(!v) aqRelease();
  aqBadge(v ? 'paused' : 'off');
}
function aqToast(text, kind){
  let el = document.getElementById('aqToast');
  if(!el){
    el = document.createElement('div'); el.id = 'aqToast';
    el.style.cssText = 'position:fixed;left:50%;bottom:54px;transform:translateX(-50%);z-index:300;padding:10px 18px;border-radius:12px;font-size:14px;font-weight:700;background:var(--card2);box-shadow:0 8px 24px rgba(0,0,0,.5);max-width:90vw;text-align:center;';
    document.body.appendChild(el);
  }
  const col = kind === 'err' ? 'var(--red)' : 'var(--green)';
  el.style.border = '1.5px solid ' + col; el.style.color = col;
  el.textContent = text; el.style.display = 'block';
  clearTimeout(el._t); el._t = setTimeout(() => { el.style.display = 'none'; }, 3500);
}
function aqBadge(state){
  const app = document.getElementById('app'), hv = document.getElementById('homeView');
  const show = !!(app && !app.classList.contains('hidden') && hv && !hv.classList.contains('hidden'));
  const key = state + (show ? '1' : '0');
  if(key === aqState) return; aqState = key;
  let b = document.getElementById('aqBadge');
  if(!b){
    b = document.createElement('div'); b.id = 'aqBadge';
    b.style.cssText = 'position:fixed;bottom:8px;right:8px;z-index:60;align-items:center;gap:6px;padding:5px 11px;border-radius:20px;font-size:11px;font-weight:700;background:var(--card2);color:var(--text);border:1px solid var(--line);cursor:pointer;opacity:.92;';
    b.onclick = () => aqSetEnabled(!aqEnabled());
    document.body.appendChild(b);
  }
  b.style.display = show ? 'flex' : 'none';
  const dot = state === 'on' ? 'var(--green)' : state === 'err' ? 'var(--red)' : state === 'off' ? 'var(--muted)' : 'var(--orange)';
  const txt = state === 'off' ? t('autoQrLabel') + ' — ' + t('autoQrOff') : state === 'err' ? t('autoQrNoCam') : t('autoQrLabel');
  b.innerHTML = '<span style="width:8px;height:8px;border-radius:50%;background:' + dot + ';display:inline-block;"></span><span>📷 ' + escapeHtml(txt) + '</span>';
}
function aqCanScan(){
  const app = document.getElementById('app'), hv = document.getElementById('homeView');
  if(!app || app.classList.contains('hidden') || !hv || hv.classList.contains('hidden')) return false;
  if(document.visibilityState !== 'visible') return false;
  const mr = document.getElementById('modalRoot'); if(mr && mr.innerHTML.trim() !== '') return false;
  if(document.getElementById('qrScanOverlay') || document.getElementById('webcamOverlay') || document.getElementById('membersAdminModal') || document.querySelector('.pw-confirm-overlay')) return false;
  return true;
}
function aqRelease(){
  if(document.getElementById('qrScanOverlay') || document.getElementById('webcamOverlay')) return;
  if(qrStream){ qrStream.getTracks().forEach(x => x.stop()); qrStream = null; }
  if(aqVideo) aqVideo.srcObject = null;
  aqPrev = null;
}
function aqEnsureVideo(){
  if(!aqVideo){
    aqVideo = document.createElement('video'); aqVideo.muted = true; aqVideo.setAttribute('playsinline', '');
    aqVideo.style.cssText = 'position:fixed;left:-9999px;top:0;width:320px;height:240px;opacity:0;pointer-events:none;';
    document.body.appendChild(aqVideo);
  }
  return aqVideo;
}
function aqStep(){
  const now = Date.now();
  if(!aqEnabled()){ aqRelease(); aqBadge('off'); return 1500; }
  if(!aqCanScan()){
    aqBlockedUntil = now + 2500;                       // بعد إغلاق النافذة ننتظر قليلا كي لا تُفتح البطاقة مرتين
    if(!aqPausedSince) aqPausedSince = now;
    if(now - aqPausedSince > 60000) aqRelease();       // خارج الصفحة الرئيسية لأكثر من دقيقة: نحرّر الكاميرا
    aqBadge('paused'); return 800;
  }
  aqPausedSince = 0;
  if(now - aqLastActivity > AQ_IDLE_MS){                // لا حركة فأرة/لوحة مفاتيح منذ 15 ث: نغلق الكاميرا لتوفير المعالج
    aqIdle = true; aqRelease(); aqBadge('paused'); return 500;
  }
  aqIdle = false;
  if(now < aqBlockedUntil || now < aqRetryAt) return 400;
  const v = aqEnsureVideo();
  const live = qrStream && qrStream.getTracks().some(x => x.readyState === 'live');
  if(!live){
    if(aqOpening) return 500;
    aqOpening = true; aqBadge('paused');
    qrOpenStream(true).then(() => { v.srcObject = qrStream; return v.play().catch(() => {}); })
      .catch(() => { aqRetryAt = Date.now() + 60000; aqBadge('err'); })
      .finally(() => { aqOpening = false; });
    return 500;
  }
  if(v.srcObject !== qrStream){ v.srcObject = qrStream; v.play().catch(() => {}); return 300; }
  if(!(v.readyState >= 2 && v.videoWidth > 0)) return 300;
  aqBadge('on');
  // 1) كشف حركة رخيص على صورة صغيرة جدا
  if(!aqSm){ aqSm = document.createElement('canvas'); aqSm.width = 48; aqSm.height = 36; }
  const sx = aqSm.getContext('2d', { willReadFrequently:true });
  sx.drawImage(v, 0, 0, 48, 36);
  const d = sx.getImageData(0, 0, 48, 36).data, n = 48*36, cur = new Uint8Array(n);
  let diff = 0;
  for(let i = 0, j = 0; i < n; i++, j += 4){ const l = (d[j]*77 + d[j+1]*150 + d[j+2]*29) >> 8; cur[i] = l; if(aqPrev) diff += Math.abs(l - aqPrev[i]); }
  const moving = aqPrev ? (diff / n) > 3 : true;
  aqPrev = cur;
  if(moving) aqMotionUntil = now + 2000;
  const active = now < aqMotionUntil;
  // 2) فك الترميز: كل ~0.25 ث أثناء الحركة، وكل ~1.2 ث فقط عند السكون
  if(now - aqLastDecode < (active ? 220 : 1200)) return active ? 120 : 400;
  aqLastDecode = now;
  const cw = Math.min(v.videoWidth, 640), ch = Math.round(v.videoHeight * cw / v.videoWidth);
  if(!aqCv) aqCv = document.createElement('canvas');
  if(aqCv.width !== cw || aqCv.height !== ch){ aqCv.width = cw; aqCv.height = ch; }
  const cx = aqCv.getContext('2d', { willReadFrequently:true });
  cx.drawImage(v, 0, 0, cw, ch);
  let txt = null; try{ txt = window.SamQR.scan(cx.getImageData(0, 0, cw, ch)); }catch(e){}
  if(txt) qrOnText(txt);
  return active ? 120 : 400;
}
const AQ_IDLE_MS = 15000;
let aqLastActivity = Date.now(), aqIdle = false;
function aqActivity(){
  aqLastActivity = Date.now();
  if(aqIdle){ aqIdle = false; aqBlockedUntil = 0; clearTimeout(aqTimer); aqTimer = setTimeout(aqLoop, 0); }   // استئناف فوري بمجرد الحركة
}
['mousemove','mousedown','keydown','wheel','touchstart','pointerdown'].forEach(ev => document.addEventListener(ev, aqActivity, { passive:true, capture:true }));
function aqLoop(){
  clearTimeout(aqTimer);
  let next = 1000; try{ next = aqStep(); }catch(e){}
  aqTimer = setTimeout(aqLoop, next);
}
document.addEventListener('visibilitychange', () => { if(document.visibilityState !== 'visible') aqBlockedUntil = Date.now() + 1500; });
setTimeout(aqLoop, 2500);
/* ============================================================
   WEBCAM CAPTURE (for desktop computers where the file-input
   "capture" attribute does not open a real camera)
============================================================ */
let webcamStream = null;
let webcamIdleTimer = null;
function openWebcamModal(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    alert('متصفحك لا يدعم فتح الكاميرا من هنا. جرّب متصفح آخر (Chrome/Edge حديث)، أو استخدم خيار "من المعرض".');
    return;
  }
  const overlay = document.createElement('div');
  overlay.id = 'webcamOverlay';
  overlay.innerHTML = `
    <div class="modal-bg cam-overlay" onclick="if(event.target===this) closeWebcamModal()">
      <div class="modal" style="max-width:min(95vw,860px);width:95vw;">
        <div class="modal-head"><h3>🖥️ التقاط صورة من كاميرا الكمبيوتر</h3><button class="close" onclick="closeWebcamModal()">×</button></div>
        <div class="form-grid">
          <video id="webcamVideo" autoplay playsinline muted style="width:100%;max-height:70vh;min-height:320px;object-fit:cover;border-radius:14px;background:#000;transform:scaleX(-1);"></video>
          <div class="err-msg" id="webcamErr"></div>
          <div class="row" style="display:flex;gap:8px;">
            <button class="btn btn-gold grow" style="flex:1;" onclick="captureWebcamPhoto()">📸 التقاط الصورة</button>
            <button class="btn btn-ghost grow" style="flex:1;" onclick="closeWebcamModal()">إلغاء</button>
          </div>
        </div>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  pushBackGuard();
  clearTimeout(webcamIdleTimer);
  // reuse the already-granted stream so the browser doesn't ask permission again every time
  if(webcamStream && webcamStream.getTracks().some(t=>t.readyState==='live')){
    const v = document.getElementById('webcamVideo');
    if(v) v.srcObject = webcamStream;
    return;
  }
  navigator.mediaDevices.getUserMedia({ video: { width:{ideal:1280}, height:{ideal:720} }, audio: false })
    .then(stream=>{
      webcamStream = stream;
      const v = document.getElementById('webcamVideo');
      if(v) v.srcObject = stream;
    })
    .catch(err=>{
      const e = document.getElementById('webcamErr');
      let msg = 'تعذّر فتح الكاميرا. تأكد من عدم استخدامها من برنامج آخر (مثل Zoom أو Teams) ومن السماح لهذا المتصفح بالوصول إليها.';
      if(err && err.name === 'NotAllowedError') msg = 'تم رفض إذن الوصول إلى الكاميرا. فعّل إذن الكاميرا لهذه الصفحة من إعدادات المتصفح ثم أعد المحاولة.';
      if(err && err.name === 'NotFoundError') msg = 'لم يتم العثور على كاميرا متصلة بالكمبيوتر.';
      if(e) e.textContent = msg;
    });
}
function closeWebcamModal(){
  // keep the stream alive for a while (no repeated permission prompt); release camera after 3 min idle
  clearTimeout(webcamIdleTimer);
  webcamIdleTimer = setTimeout(()=>{
    if(webcamStream){ webcamStream.getTracks().forEach(t=>t.stop()); webcamStream = null; }
  }, 180000);
  const overlay = document.getElementById('webcamOverlay');
  if(overlay) overlay.remove();
}
function captureWebcamPhoto(){
  const v = document.getElementById('webcamVideo');
  if(!v || !v.videoWidth){
    const e = document.getElementById('webcamErr');
    if(e) e.textContent = 'الكاميرا لم تجهز بعد، انتظر لحظة وحاول مجددًا.';
    return;
  }
  const canvas = document.createElement('canvas');
  canvas.width = v.videoWidth; canvas.height = v.videoHeight;
  const ctx = canvas.getContext('2d');
  // un-mirror the image so the saved photo reads naturally
  ctx.translate(canvas.width, 0); ctx.scale(-1, 1);
  ctx.drawImage(v, 0, 0);
  const dataUrl = canvas.toDataURL('image/jpeg', 0.9);
  compressImageSrc(dataUrl, 900, 0.85).then(brandPhoto).then(compressed=>{
    photoDataTemp = compressed;
    const preview = document.getElementById('photoPreview');
    if(preview) preview.innerHTML = `<img src="${photoDataTemp}" style="width:100%;height:100%;border-radius:14px;object-fit:cover;">`;
    closeWebcamModal();
  }).catch(()=>{
    photoDataTemp = dataUrl;
    const preview = document.getElementById('photoPreview');
    if(preview) preview.innerHTML = `<img src="${photoDataTemp}" style="width:100%;height:100%;border-radius:14px;object-fit:cover;">`;
    closeWebcamModal();
  });
}
function submitMemberForm(){
  const _isNew = !editingId;
  const firstName = document.getElementById('fFirst').value.trim();
  const lastName = document.getElementById('fLast').value.trim();
  const phone = document.getElementById('fPhone').value.trim();
  const subType = document.getElementById('fSubType').value;
  const startDate = document.getElementById('fStart').value;
  const amountPaid = Number(document.getElementById('fAmount').value || 0);
  if(!firstName || !lastName || !startDate){
    document.getElementById('addErr').textContent = 'يرجى ملء الاسم واللقب وتاريخ البداية';
    return;
  }
  const plan = planById(subType);
  const remaining = Math.max(plan.price - amountPaid, 0);
  const endDate = addDays(startDate, 30);
  const sd = parseLocalDate(startDate);
  const targetKey = monthKey(sd.getFullYear(), sd.getMonth());
  if(!db[targetKey]) db[targetKey] = [];
  const members = db[targetKey];
  const fileBrought = !!(document.getElementById('fFileBrought')||{}).checked;
  const record = {firstName,lastName,phone,subType,startDate,amountPaid,remaining,endDate,photo:photoDataTemp,fileBrought};
  let movedFrom = null;
  if(editingId){
    const oldList = currentMembers();
    const m = oldList.find(x=>x.id===editingId);
    Object.assign(m,record);
    if(oldList !== members){
      oldList.splice(oldList.indexOf(m),1);
      members.push(m);
      movedFrom = oldList;
    }
  } else {
    members.push({
      id: 'm_'+Date.now()+'_'+Math.floor(Math.random()*1000),
      ...record,
      createdAt:new Date().toISOString()
    });
  }
  document.getElementById('addErr').style.color = '';
  document.getElementById('addErr').textContent = '';
  const ok = saveDB();
  if(!ok){
    // rollback the push if it was a new member and saving failed
    if(!editingId){ members.pop(); }
    document.getElementById('addErr').style.color = 'var(--red)';
    document.getElementById('addErr').textContent = 'تعذر الحفظ: الذاكرة ممتلئة. حاول بصورة أخف أو بدون صورة.';
    playErrorSound();
    return;
  }
  closeModal();
  // go to the month/year of the subscription start date so the member is visible
  state.month = sd.getMonth(); state.year = sd.getFullYear();
  const ms = document.getElementById('monthSelect'), ys = document.getElementById('yearSelect');
  if(ms){ ms.value = state.month; buildCustomSelectMenu('monthSelect'); }
  if(ys){ ys.value = state.year; buildCustomSelectMenu('yearSelect'); }
  render();
  playSuccessSound();
  if(_isNew) appShareAfterAdd(firstName, lastName, phone, record.photo);
}

async function appSharePrepare(first, last, phone){

async function appShareUploadCard(blob){
  if(APPSH.cardUrl) return APPSH.cardUrl;
  try{
    const png = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(blob); });
    const r = await srvApi('api/m/card', { method:'POST', body:{ png } }, 60000);

  }catch(e){}

function _asImg(src){ return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; }); }
function _asRR(c, x, y, w, h, r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
async function buildMemberCard(){
  const W = 800, H = 1270, cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const c = cv.getContext('2d'); c.direction = 'rtl'; c.textAlign = 'center'; c.textBaseline = 'middle';
  const F = 'Tahoma, "Segoe UI", Arial, sans-serif';
  // background
  let g = c.createLinearGradient(0,0,W,H); g.addColorStop(0,'#1d252d'); g.addColorStop(.55,'#141a20'); g.addColorStop(1,'#0c0f13');
  c.fillStyle = g; _asRR(c,0,0,W,H,48); c.fill();
  g = c.createRadialGradient(W/2,120,10,W/2,120,520); g.addColorStop(0,'rgba(255,122,26,.32)'); g.addColorStop(1,'rgba(255,122,26,0)');
  c.fillStyle = g; c.fillRect(0,0,W,700);
  c.strokeStyle = 'rgba(255,255,255,.12)'; c.lineWidth = 3; _asRR(c,6,6,W-12,H-12,44); c.stroke();
  // gym name
  c.fillStyle = '#ff8f3d'; c.font = '800 58px '+F;
  let gn = appName(); while(c.measureText(gn).width > W-100 && c.font.indexOf('px') > 0){ const sz = parseInt(c.font.match(/(\d+)px/)[1]) - 4; c.font = '800 '+sz+'px '+F; if(sz < 28) break; }
  c.fillText(gn, W/2, 96);
  c.fillStyle = '#8f9ba8'; c.font = '600 28px '+F; c.fillText('بطاقة المشترك', W/2, 158);
  c.fillStyle = 'rgba(255,255,255,.12)'; c.fillRect(120, 196, W-240, 2);
  // photo (square)
  const px = W/2-150, py = 232, ps = 300;
  c.save(); _asRR(c,px,py,ps,ps,36); c.clip();
  let drawn = false;
  if(APPSH.photo){ try{ const im = await _asImg(APPSH.photo), k = Math.max(ps/im.width, ps/im.height), w = im.width*k, h = im.height*k; c.drawImage(im, px+(ps-w)/2, py+(ps-h)/2, w, h); drawn = true; }catch(e){} }
  if(!drawn){ c.fillStyle = '#212932'; c.fillRect(px,py,ps,ps); c.fillStyle = '#ff8f3d'; c.font = '800 130px '+F; c.fillText((APPSH.first||'?').trim().charAt(0), W/2, py+ps/2+6); }
  c.restore();
  c.strokeStyle = '#ff7a1a'; c.lineWidth = 6; _asRR(c,px,py,ps,ps,36); c.stroke();
  // name + last name
  c.fillStyle = '#f3f5f7'; c.font = '800 54px '+F; c.fillText((APPSH.first||'').trim().toUpperCase(), W/2, 592);
  c.fillStyle = '#ffb15c'; c.font = '700 46px '+F; c.fillText((APPSH.last||'').trim().toUpperCase(), W/2, 654);
  // QR
  const qx = W/2-190, qy = 716, qs = 380;
  c.fillStyle = '#fff'; _asRR(c,qx-14,qy-14,qs+28,qs+28,28); c.fill();
  SGQR.draw(c, APPSH.lk, qx, qy, qs);   // رسم QR مباشرة على البطاقة (بدون خادم أو تحميل صورة)
  c.fillStyle = '#8f9ba8'; c.font = '600 26px '+F; c.fillText('امسح الرمز لفتح تطبيقك مباشرة', W/2, 1160);
  c.fillStyle = '#ff8f3d'; c.font = '800 34px '+F; c.fillText('رمز الدخول: '+APPSH.code, W/2, 1218);
  return await new Promise(res => cv.toBlob(res, 'image/png'));
}

/* ---------- WhatsApp opening (fix for blank/black screen on WhatsApp Web) ----------
   Problems fixed:
   1) Every click opened a NEW tab through wa.me -> api.whatsapp.com ("Partager sur
      WhatsApp") -> web.whatsapp.com. Several WhatsApp Web tabs at once make WhatsApp
      Web stay blank ("open in another window").
   2) Now on computer we go straight to web.whatsapp.com/send?phone=...&text=... and
      ALWAYS reuse the same named tab ("samgym_whatsapp"), so only one WhatsApp Web
      tab ever exists and the chat of the right person opens directly.
   3) Local Algerian numbers (0555...) are converted to international format (213555...). */
function waNormalizePhone(raw){
  let d = String(raw||'')
    .replace(/[٠-٩]/g, c=>String(c.charCodeAt(0)-1632))      // Arabic-Indic digits
    .replace(/[۰-۹]/g, c=>String(c.charCodeAt(0)-1776))      // Persian digits
    .replace(/[^0-9]/g,'');
  if(d.indexOf('00')===0) d = d.slice(2);
  if(d.indexOf('2130')===0) d = '213' + d.slice(4);                         // 213 0555.. -> 213555..
  else if(d.charAt(0)==='0' && d.length===10) d = '213' + d.slice(1);       // 0555..     -> 213555..
  else if(d.length===9 && /^[567]/.test(d)) d = '213' + d;                  // 555..      -> 213555..
  return d;
}
function isMobileDevice(){ return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent||''); }
function openWhatsAppChat(phone, text, useDesktopApp){
  const num = waNormalizePhone(phone);
  const q = encodeURIComponent(text||'');
  if(useDesktopApp){                       // WhatsApp Desktop app (Windows) if installed
    window.location.href = `whatsapp://send?phone=${num}&text=${q}`;
    return;
  }
  if(isMobileDevice()){                    // phone/tablet: wa.me opens the WhatsApp app
    const url = `https://wa.me/${num}?text=${q}`;
    const w = window.open(url, '_blank');
    if(!w) window.location.href = url;
    return;
  }
  const url = `https://web.whatsapp.com/send?phone=${num}&text=${q}`;
  const w = window.open(url, 'samgym_whatsapp');   // same tab every time
  if(!w){ window.location.href = url; return; }    // popup blocked fallback
  try{ w.focus(); }catch(e){}
}

/* ============================================================
   RENEW SUBSCRIPTION (keeps the member's personal info & photo,
   only asks for subscription type + amount paid, and restarts
   the subscription period from today for 30 days)
============================================================ */
function requestRenew(id){
  askPassword('adminPassword','أدخل كلمة مرور الإدارة للتجديد', ()=>{
    openRenewModal(id);
  }, 'renew_members');
}
function openRenewModal(id){
  const m = currentMembers().find(x=>x.id===id);
  if(!m) return;
  renewingMemberId = id;
  const oldDebt = Number(m.remaining||0);
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="modal-bg" onclick="if(event.target===this) closeModal()">
      <div class="modal" style="max-width:380px;">
        <div class="modal-head"><h3>${t('renewTitle')}</h3><button class="close" onclick="closeModal()">×</button></div>
        <div class="form-grid">
          <div class="field">
            <label>${t('renewDateLabel')}</label>
            <input type="date" id="rDate" value="${todayLocalISO()}">
          </div>
          <div class="field">
            <label>${t('subTypeLabel')}</label>
            <select id="rSubType" onchange="onRenewPlanChange()">
              ${SUBSCRIPTION_PLANS.map(p=>`<option value="${p.id}" ${m.subType===p.id?'selected':''}>${planLabel(p)} — ${p.price.toLocaleString()} ${t('currency')}</option>`).join('')}
            </select>
          </div>
          ${oldDebt > 0 ? `<div class="field"><label style="color:var(--red);">${t('renewOldDebtLabel')}</label><div style="padding:11px 13px;background:var(--bg-soft);border-radius:11px;border:1px solid var(--line);color:var(--red);font-weight:700;">${oldDebt.toLocaleString()} ${t('currency')}</div></div>` : ''}
          <div class="field">
            <label>${t('amountPaidLabel')} <span class="gold" id="renewPlanPriceHint"></span></label>
            <input type="number" id="rAmount" min="0" value="${planById(m.subType).price}">
          </div>
          <div class="err-msg" id="renewErr"></div>
          <button class="btn btn-gold" onclick="submitRenew('${m.id}')">${t('renewConfirmBtn')}</button>
        </div>
      </div>
    </div>`;
  onRenewPlanChange();
  pushBackGuard();
}
function onRenewPlanChange(){
  const sel = document.getElementById('rSubType');
  const amountInput = document.getElementById('rAmount');
  const hint = document.getElementById('renewPlanPriceHint');
  if(!sel) return;
  const plan = planById(sel.value);
  const m = currentMembers().find(x=>x.id===renewingMemberId);
  const oldDebt = m ? Number(m.remaining||0) : 0;
  const totalDue = plan.price + oldDebt;
  if(amountInput) amountInput.max = totalDue;
  if(hint) hint.textContent = oldDebt > 0
    ? `${t('planPriceHint')} ${plan.price.toLocaleString()} ${t('currency')} + ${t('renewOldDebtLabel')}: ${oldDebt.toLocaleString()} ${t('currency')} = ${totalDue.toLocaleString()} ${t('currency')}`
    : `${t('planPriceHint')} ${plan.price.toLocaleString()} ${t('currency')}`;
}
function submitRenew(id){
  const currentList = currentMembers();
  const idx = currentList.findIndex(x=>x.id===id);
  if(idx===-1) return;
  const m = currentList[idx];
  const subType = document.getElementById('rSubType').value;
  const amountPaid = Number(document.getElementById('rAmount').value || 0);
  const startDate = document.getElementById('rDate').value;
  const err = document.getElementById('renewErr');
  if(!startDate){
    if(err){ err.style.color = 'var(--red)'; err.textContent = 'يرجى اختيار تاريخ التجديد'; }
    return;
  }
  const plan = planById(subType);
  const oldDebt = Number(m.remaining||0);
  const totalDue = plan.price + oldDebt;
  const remaining = Math.max(totalDue - amountPaid, 0);
  const endDate = addDays(startDate, 30);

  // Keep the existing record exactly as it is (no deletion), and create a
  // brand-new entry with the same personal info & photo in the monthly list
  // matching the renewal date (e.g. renewing into September adds a new
  // September record while the original August one stays untouched).
  const newMember = {
    id: 'm_'+Date.now()+'_'+Math.floor(Math.random()*1000),
    firstName: m.firstName,
    lastName: m.lastName,
    phone: m.phone,
    photo: m.photo,
    fileBrought: !!m.fileBrought,
    subType, startDate, amountPaid, remaining, endDate,
    renewOf: m.id,                       // lets the server recognise this as a renewal (renew_members) and not a new registration
    createdAt: new Date().toISOString()
  };

  const d = parseLocalDate(startDate);
  const targetKey = monthKey(d.getFullYear(), d.getMonth());
  if(!db[targetKey]) db[targetKey] = [];
  db[targetKey].push(newMember);

  // Mark the original record as already renewed so its card shows
  // "تم التجديد" instead of the renew button (prevents renewing it twice).
  const wasRenewed = m.renewed;
  m.renewed = true;

  const ok = saveDB();
  if(!ok){
    db[targetKey].pop();
    m.renewed = wasRenewed;
    if(err){ err.style.color = 'var(--red)'; err.textContent = 'تعذر الحفظ: الذاكرة ممتلئة.'; }
    playErrorSound();
    return;
  }
  playSuccessSound();
  closeModal();
  render();
  alert(t('renewSuccessMsg'));
}

let _thSig = '';
function _themeNow(){
  const cs = getComputedStyle(document.documentElement), g = n => cs.getPropertyValue(n).trim(), H = /^#[0-9a-f]{6}$/i;
  const o = { bg:g('--bg'), sf:g('--card'), sf2:g('--card2'), ln:g('--line'), tx:g('--text'), mut:g('--muted'), ac:g('--gold'), ac2:g('--gold2') };
  for(const k in o) if(!H.test(o[k])) return null;
  const n = parseInt(o.ac.slice(1), 16);
  o.acx = (0.299*(n>>16&255) + 0.587*(n>>8&255) + 0.114*(n&255))/255 > 0.6 ? '#111111' : '#ffffff';
  return o;
}

    const r = await srvApi('/api/m/info', { method:'PUT', body:{ theme:th } });

/* ---- شعار القاعة: صورة عادية في البرنامج، ويصبح أيقونة التطبيق (PWA) عند المشترك ---- */
let pendingLogo = undefined;            // undefined = بلا تغيير، null = حذف، {show, icon} = صورة جديدة
function logoImgs(){ return [...document.querySelectorAll('#loginScreen .badge-ring img, .logo-mini img')]; }
function defaultLogoSrc(){ const im = logoImgs()[0]; return im ? (im.dataset.def || im.getAttribute('src')) : ''; }

function applyAppLogo(){

  logoImgs().forEach(im=>{ if(!im.dataset.def) im.dataset.def = im.getAttribute('src'); im.setAttribute('src', custom || im.dataset.def); });
}
function readLogoFile(file){
  return new Promise((res, rej)=>{
    const u = URL.createObjectURL(file), im = new Image();
    im.onload = ()=>{
      try{
        const w = im.naturalWidth, h = im.naturalHeight;
        if(!w || !h) throw new Error('bad');
        // نسخة العرض داخل البرنامج: بنفس نسبة الصورة، أقصى 256px، تحافظ على الشفافية
        const k = Math.min(1, 256 / Math.max(w, h)), dw = Math.max(1, Math.round(w * k)), dh = Math.max(1, Math.round(h * k));
        const c1 = document.createElement('canvas'); c1.width = dw; c1.height = dh; c1.getContext('2d').drawImage(im, 0, 0, dw, dh);
        // نسخة الأيقونة: مربعة 512×512 (صورة مربعة تملأ الأيقونة، وغير المربعة تُوضع كاملة في الوسط على خلفية داكنة)
        const S = 512, c2 = document.createElement('canvas'); c2.width = c2.height = S;
        const x = c2.getContext('2d'); x.fillStyle = '#101418'; x.fillRect(0, 0, S, S);
        if(Math.abs(w / h - 1) < 0.03) x.drawImage(im, 0, 0, S, S);
        else { const pad = S * 0.1, kk = Math.min((S - 2 * pad) / w, (S - 2 * pad) / h), iw = w * kk, ih = h * kk; x.drawImage(im, (S - iw) / 2, (S - ih) / 2, iw, ih); }
        URL.revokeObjectURL(u);
        res({ show: c1.toDataURL('image/png'), icon: c2.toDataURL('image/png') });
      }catch(e){ URL.revokeObjectURL(u); rej(e); }
    };
    im.onerror = ()=>{ URL.revokeObjectURL(u); rej(new Error('bad')); };
    im.src = u;
  });
}

function saveSubscriptionEdits(){
  if(!srvNeed('plans')) return;
  const labelInputs = document.querySelectorAll('.plan-label-input');
  const labelFrInputs = document.querySelectorAll('.plan-label-fr-input');
  const labelEnInputs = document.querySelectorAll('.plan-label-en-input');
  const priceInputs = document.querySelectorAll('.plan-price-input');
  labelInputs.forEach(inp=>{
    const plan = SUBSCRIPTION_PLANS.find(p=>p.id===inp.dataset.id);
    if(plan && inp.value.trim()) plan.label = inp.value.trim();
  });
  labelFrInputs.forEach(inp=>{
    const plan = SUBSCRIPTION_PLANS.find(p=>p.id===inp.dataset.id);
    if(plan) plan.labelFr = inp.value.trim();
  });
  labelEnInputs.forEach(inp=>{
    const plan = SUBSCRIPTION_PLANS.find(p=>p.id===inp.dataset.id);
    if(plan) plan.labelEn = inp.value.trim();
  });
  priceInputs.forEach(inp=>{
    const plan = SUBSCRIPTION_PLANS.find(p=>p.id===inp.dataset.id);
    if(plan && inp.value !== '') plan.price = Number(inp.value);
  });
  savePlans();
  initFilters();
  render();
  renderPlansViewList();
  const msg = document.getElementById('plansMsg');
  if(msg){ msg.style.color = 'var(--green)'; msg.textContent = 'تم حفظ تعديلات الاشتراكات ✔'; }

    if(msg){ msg.style.color = 'var(--red)'; msg.textContent = 'يرجى إدخال اسم وسعر صحيحين للاشتراك الجديد'; }

function saveExtraPw(kind){

  msg.textContent = '';
  if(!n.value) return;
  if(settings[K] && (!o || o.value !== settings[K])){ msg.style.color='var(--red)'; msg.textContent=t('pwWrongCurrent'); playErrorSound(); return; }
  settings[K] = n.value; settings[K+'Enabled'] = true; saveSettings();
  n.value=''; if(o) o.value='';
  msg.style.color='var(--green)'; msg.textContent='تم الحفظ — كلمة السر مفعّلة ✔'; playSuccessSound();

function toggleExtraPw(cb, kind){
  const K = kind+'Password';
  if(!srvNeed('security')) { cb.checked = !cb.checked; return; }
  if(cb.checked){
    if(!settings[K]){ cb.checked = false; alert('اضغط «تعديل كلمة المرور» وأدخل كلمة سر جديدة أولا.'); return; }
    settings[K+'Enabled'] = true; saveSettings(); return;
  }
  const v = prompt('أدخل كلمة السر الحالية للتعطيل:');
  if(v === settings[K]){ settings[K+'Enabled'] = false; saveSettings(); }
  else { cb.checked = true; if(v !== null) alert('كلمة مرور غير صحيحة'); }
}

    pwKey: which==='login' ? 'loginPassword' : (which==='admin' ? 'adminPassword' : 'expensesPassword'),
    oldId: which==='login' ? 'oldLoginPw' : (which==='admin' ? 'oldAdminPw' : 'oldExpPw'),
    newId: which==='login' ? 'newLoginPw' : (which==='admin' ? 'newAdminPw' : 'newExpPw')

function savePasswordItem(which){
  if(!srvNeed('security')) return;
  const f = pwFieldsFor(which);
  const oldVal = document.getElementById(f.oldId).value;
  const newVal = document.getElementById(f.newId).value;
  const msg = document.getElementById('pwEditMsg-' + which);

    msg.style.color = 'var(--red)';

  }
  settings[f.pwKey] = newVal;

  msg.style.color = 'var(--green)';
  msg.textContent = t('pwSavedMsg');

}
function togglePasswordProtection(which, enabled, checkboxEl){
  if(!srvNeed('security')) return;
  const f = pwFieldsFor(which);
  const msg = document.getElementById('pwToggleMsg');
  if(enabled === false){
    // Turning OFF requires confirming the current password first.
    if(checkboxEl) checkboxEl.checked = true; // keep visually ON until confirmed
    showPwDisableConfirm(which, ()=>{
      settings[f.enabledKey] = false;
      saveSettings();
      if(checkboxEl) checkboxEl.checked = false;
      if(msg){ msg.style.color = 'var(--green)'; msg.textContent = t('pwToggleOffMsg'); }
    });
    return;
  }
  settings[f.enabledKey] = true;
  saveSettings();
  if(msg){ msg.style.color = 'var(--green)'; msg.textContent = t('pwToggleOnMsg'); }
}
function showPwDisableConfirm(which, onConfirmed){
  const f = pwFieldsFor(which);
  const overlay = document.createElement('div');
  overlay.className = 'pw-confirm-overlay';
  overlay.innerHTML = `
    <div class="pw-confirm-box">

        <button class="btn btn-gold grow" id="pwDisableConfirmBtn">${t('confirmBtn')}</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  const input = overlay.querySelector('#pwDisableInput');
  input.focus();
  const cleanup = ()=>{ overlay.remove(); };
  overlay.addEventListener('click', e=>{ if(e.target===overlay) cleanup(); });
  overlay.querySelector('#pwDisableCancelBtn').onclick = cleanup;

    }
  };
  overlay.querySelector('#pwDisableConfirmBtn').onclick = submit;
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
}

   EXPORT / IMPORT (transfer data between devices)
============================================================ */
function exportData(){
  if(!srvNeed('export_data')) return;
  const payload = { db, expenses, dietFiles, exportedAt:new Date().toISOString() };
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'samgym_backup_'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
function importData(e){
  if(!srvNeed('import_data')){ e.target.value = ''; return; }
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const parsed = JSON.parse(reader.result);
      const incoming = parsed.db || parsed;
      const incomingExp = parsed.expenses || {};
      const incomingDiet = parsed.dietFiles || [];
      askPassword('adminPassword','تأكيد استيراد البيانات (سيتم دمجها مع البيانات الحالية)', ()=>{
        // the server accepts each kind of record only from accounts that may write it: skip what this account cannot write
        const canMem = srvCan('add_members'), canExp = srvCan('expenses'), canDiet = srvCan('diet');
        const skipped = [];
        if(!canMem) skipped.push('المشتركين');
        if(!canExp) skipped.push('المصاريف');
        if(!canDiet) skipped.push('ملفات الحمية');
        Object.keys(canMem ? incoming : {}).forEach(key=>{
          if(!db[key]) db[key] = incoming[key];
          else {
            const existingIds = new Set(db[key].map(m=>m.id));
            incoming[key].forEach(m=>{ if(!existingIds.has(m.id)) db[key].push(m); });
          }
        });
        Object.keys(canExp ? incomingExp : {}).forEach(key=>{
          if(!expenses[key]) expenses[key] = incomingExp[key];
          else {
            const existingIds = new Set(expenses[key].map(x=>x.id));
            incomingExp[key].forEach(x=>{ if(!existingIds.has(x.id)) expenses[key].push(x); });
          }
        });
        const existingDietIds = new Set(dietFiles.map(f=>f.id));
        (canDiet ? incomingDiet : []).forEach(f=>{ if(!existingDietIds.has(f.id)) dietFiles.push(f); });
        saveDB();
        saveExpenses();
        saveDietFiles();
        render();
        alert('تم استيراد البيانات بنجاح ✔' + (skipped.length ? '\n\nتم تجاهل: ' + skipped.join('، ') + ' (لا تملك صلاحية إضافتها).' : ''));
      }, 'import_data');
    }catch(err){ alert('ملف غير صالح'); }
  };
  reader.readAsText(file);
  e.target.value = '';
}

      now:'💾 Back up now', empty:'No saved backups yet.', restore:'Restore', dl:'Download',
      members:'members', auto:'auto', manual:'manual', unsupported:'Advanced storage is not supported in this browser.',
      done:'Backup created ✔', nodata:'No data to back up.', confirm:'Confirm restore (current data will be replaced)',
      restored:'Backup restored ✔', missing:'Backup missing or corrupted.', last:'Last backup'}
};
function bkT(k){ return (BK_TXT[currentLang] || BK_TXT.ar)[k] || BK_TXT.ar[k]; }
async function bkGetIndex(){
  if(!idbHandle) return [];
  const v = await idbGet(BK_INDEX_KEY);
  return Array.isArray(v) ? v : [];
}
/* returns 'created' | 'skipped' | 'nodata' | 'error' */
async function runBackup(force){
  if(!idbHandle) return 'error';
  if(bkBusy) return 'skipped';
  bkBusy = true;
  try{
    const idx = await bkGetIndex();
    const last = idx[0];
    if(!force && last && Date.now()-last.at < BK_INTERVAL_MS) return 'skipped';
    const members = Object.values(db).reduce((s,a)=>s+(Array.isArray(a)?a.length:0),0);
    if(!(members>0 || Object.keys(expenses).length>0 || dietFiles.length>0)) return 'nodata';
    const json = JSON.stringify({db, expenses, dietFiles});
    if(!force && last){
      const prev = await idbGet(last.key);
      if(prev === json){ last.at = Date.now(); await idbSet(BK_INDEX_KEY, idx); return 'skipped'; }
    }
    const entry = { key:'samgym_bk_'+Date.now(), at:Date.now(), size:json.length, members, auto:!force };
    const ok = await idbSet(entry.key, json);
    if(!ok) return 'error';
    idx.unshift(entry);
    bkWriteToFile(json);   // نسخة إضافية في الملف الذي اختاره المستخدم
    while(idx.length > BK_KEEP){ const old = idx.pop(); await idbDel(old.key); }
    await idbSet(BK_INDEX_KEY, idx);
    return 'created';
  }catch(e){
    console.error('backup failed', e);
    return 'error';
  }finally{
    bkBusy = false;
    if(document.getElementById('bkList')) renderBackupList();
  }
}
/* ---------- حفظ النسخة الاحتياطية في ملف يختاره المستخدم ---------- */
const BK_FILE_KEY = 'samgym_bk_filehandle';
const BK_FILE_TXT = {
  ar:{title:'📁 ملف الحفظ التلقائي', choose:'اختيار ملف الحفظ', change:'تغيير الملف', stop:'إلغاء', grant:'السماح بالكتابة في الملف',
      none:'لم يتم اختيار ملف. تُحفظ النسخ داخل المتصفح فقط.', active:'تُكتب كل نسخة تلقائية (كل 4 ساعات) في الملف:',
      restoreFile:'♻️ استرجاع من الملف', pending:'يحتاج إذنك للكتابة في الملف بعد إعادة فتح البرنامج.', unsupported:'اختيار ملف الحفظ غير مدعوم في هذا المتصفح (استخدم Chrome أو Edge على الكمبيوتر).',
      saved:'تم الحفظ في الملف ✔', failed:'تعذّر الكتابة في الملف.'},
  fr:{title:'📁 Fichier de sauvegarde automatique', choose:'Choisir le fichier', change:'Changer le fichier', stop:'Retirer', grant:'Autoriser l’écriture',
      none:'Aucun fichier choisi. Les copies restent dans le navigateur.', active:'Chaque copie automatique (toutes les 4 h) est écrite dans le fichier :',
      restoreFile:'♻️ Restaurer depuis le fichier', pending:'Votre autorisation est nécessaire pour écrire dans le fichier après la réouverture.', unsupported:'Le choix d’un fichier n’est pas pris en charge (utilisez Chrome ou Edge sur ordinateur).',
      saved:'Enregistré dans le fichier ✔', failed:'Écriture dans le fichier impossible.'},
  en:{title:'📁 Auto-backup file', choose:'Choose backup file', change:'Change file', stop:'Remove', grant:'Allow writing to file',
      none:'No file chosen. Backups stay inside the browser only.', active:'Every automatic backup (every 4 hours) is written to the file:',
      restoreFile:'♻️ Restore from file', pending:'Your permission is needed to write to the file after reopening the app.', unsupported:'Choosing a file is not supported in this browser (use Chrome or Edge on desktop).',
      saved:'Saved to file ✔', failed:'Could not write to the file.'}
};
function bfT(k){ return (BK_FILE_TXT[currentLang] || BK_FILE_TXT.ar)[k]; }
async function bkGetFileHandle(){
  if(!idbHandle) return null;
  const h = await idbGet(BK_FILE_KEY);
  return (h && h.createWritable) ? h : null;
}
async function bkWriteToFile(json, interactive){
  try{
    const h = await bkGetFileHandle();
    if(!h) return false;
    let perm = await h.queryPermission({mode:'readwrite'});
    if(perm !== 'granted' && interactive) perm = await h.requestPermission({mode:'readwrite'});
    if(perm !== 'granted'){ renderBkFileBox(); return false; }
    if(!json){
      json = JSON.stringify({db, expenses, dietFiles});
    }
    const w = await h.createWritable();
    await w.write(json);
    await w.close();
    renderBkFileBox();
    return true;
  }catch(e){
    console.error('file backup failed', e);
    return false;
  }
}
async function pickBackupFile(){
  if(!window.showSaveFilePicker){ alert(bfT('unsupported')); return; }
  try{
    const h = await window.showSaveFilePicker({
      suggestedName:'samgym_backup.json',
      types:[{description:'JSON', accept:{'application/json':['.json']}}]
    });
    await idbSet(BK_FILE_KEY, h);
    await bkWriteToFile(null, true);
    renderBkFileBox();
  }catch(e){ /* cancelled */ }
}
async function grantBackupFile(){
  const ok = await bkWriteToFile(null, true);
  renderBkFileBox();
  alert(ok ? bfT('saved') : bfT('failed'));
}
async function restoreFromBackupFile(){
  if(!srvNeed('backups')) return;
  try{
    let json = null;
    const h = await bkGetFileHandle();
    if(h){
      let perm = await h.queryPermission({mode:'read'});
      if(perm !== 'granted') perm = await h.requestPermission({mode:'read'});
      if(perm === 'granted') json = await (await h.getFile()).text();
    }
    if(json === null && window.showOpenFilePicker){
      const [fh] = await window.showOpenFilePicker({types:[{description:'JSON', accept:{'application/json':['.json']}}]});
      json = await (await fh.getFile()).text();
    }
    let parsed = null;
    try{ parsed = json ? JSON.parse(json) : null; }catch(e){ parsed = null; }
    if(!parsed || typeof parsed !== 'object' || !parsed.db){ alert(bkT('missing')); return; }
    askPassword('adminPassword', bkT('confirm'), async ()=>{
      await runBackup(true);   // نسخة أمان من الوضع الحالي قبل الاستبدال
      db = parsed.db || {};
      expenses = parsed.expenses || {};
      dietFiles = parsed.dietFiles || [];
      saveDB(); saveExpenses(); saveDietFiles();
      render();
      renderBackupList();
      alert(bkT('restored'));
    }, 'backups');
  }catch(e){ /* cancelled */ }
}
async function clearBackupFile(){
  await idbDel(BK_FILE_KEY);
  renderBkFileBox();
}
async function renderBkFileBox(){
  const box = document.getElementById('bkFileBox');
  if(!box) return;
  if(!window.showSaveFilePicker){ box.innerHTML = `<div style="font-size:12px;color:var(--muted);">${bfT('unsupported')}</div>`; return; }
  const h = await bkGetFileHandle();
  if(!document.getElementById('bkFileBox')) return;
  let html = `<div style="font-weight:700;font-size:13px;margin-bottom:6px;">${bfT('title')}</div>`;
  if(!h){
    html += `<div style="font-size:12px;color:var(--muted);margin-bottom:8px;">${bfT('none')}</div>
      <button class="btn btn-ghost btn-sm" style="width:100%;" onclick="pickBackupFile()">${bfT('choose')}</button>`;
  }else{
    let perm = 'prompt';
    try{ perm = await h.queryPermission({mode:'readwrite'}); }catch(e){}
    html += `<div style="font-size:12px;color:var(--muted);margin-bottom:6px;">${bfT('active')}</div>
      <div style="font-size:13px;font-weight:700;direction:ltr;text-align:start;margin-bottom:8px;word-break:break-all;">${escapeHtmlBk(h.name)}</div>`;
    html += `<button class="btn btn-gold btn-sm" style="width:100%;margin-bottom:6px;" onclick="restoreFromBackupFile()">${bfT('restoreFile')}</button>
      <div style="display:flex;gap:6px;">
        <button class="btn btn-ghost btn-sm" style="flex:1;" onclick="pickBackupFile()">${bfT('change')}</button>
        <button class="btn btn-ghost btn-sm" style="flex:1;" onclick="clearBackupFile()">${bfT('stop')}</button></div>`;
  }
  box.innerHTML = html;
}
function escapeHtmlBk(x){ return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function startAutoBackup(){
  // لا شيء يظهر عند الفتح: إذا لزم تجديد إذن الملف يُطلب بصمت عند أول نقرة للمستخدم
  const once = async ()=>{
    document.removeEventListener('pointerdown', once, true);
    try{ const h = await bkGetFileHandle(); if(h && await h.queryPermission({mode:'readwrite'})!=='granted') await bkWriteToFile(null, true); }catch(e){}
  };
  document.addEventListener('pointerdown', once, true);
  setTimeout(()=>runBackup(false), 4000);
  setInterval(()=>runBackup(false), 5*60*1000);
}
async function manualBackup(){
  if(!srvNeed('backups')) return;
  const r = await runBackup(true);
  alert(r==='created' ? bkT('done') : (r==='nodata' ? bkT('nodata') : bkT('unsupported')));
}
function bkFmtDate(ts){
  const d = new Date(ts), p = n=>String(n).padStart(2,'0');
  return `${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
async function renderBackupList(){
  const box = document.getElementById('bkList');
  if(!box) return;
  if(!idbHandle){ box.innerHTML = `<div class="empty-state" style="padding:12px;">${bkT('unsupported')}</div>`; return; }
  const idx = await bkGetIndex();
  if(!document.getElementById('bkList')) return;
  if(!idx.length){ box.innerHTML = `<div class="empty-state" style="padding:12px;">${bkT('empty')}</div>`; return; }
  box.innerHTML = idx.map(e=>`
    <div style="display:flex; align-items:center; justify-content:space-between; gap:8px; padding:9px 10px; margin-bottom:6px; background:var(--card); border:1px solid var(--line); border-radius:11px;">
      <div style="min-width:0;">
        <div style="font-weight:700; font-size:13px; direction:ltr; text-align:start;">${bkFmtDate(e.at)}</div>
        <div style="font-size:11px; color:var(--muted);">${e.members} ${bkT('members')} · ${(e.size/1024/1024).toFixed(1)} MB · ${e.auto?bkT('auto'):bkT('manual')}</div>
      </div>
      <div style="display:flex; gap:6px; flex-shrink:0;">
        <button class="btn btn-ghost btn-sm" onclick="downloadBackup('${e.key}')">${bkT('dl')}</button>
        <button class="btn btn-gold btn-sm" onclick="restoreBackup('${e.key}')">${bkT('restore')}</button>
      </div>
    </div>`).join('');
}
async function downloadBackup(key){
  const json = await idbGet(key);
  if(!json){ alert(bkT('missing')); return; }
  const idx = await bkGetIndex();
  const e = idx.find(x=>x.key===key);
  const blob = new Blob([json], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const d = new Date(e ? e.at : Date.now()), p = n=>String(n).padStart(2,'0');
  a.download = `samgym_backup_${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}_${p(d.getHours())}h${p(d.getMinutes())}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
function restoreBackup(key){
  askPassword('adminPassword', bkT('confirm'), async ()=>{
    const json = await idbGet(key);
    let parsed = null;
    try{ parsed = json ? JSON.parse(json) : null; }catch(e){ parsed = null; }
    if(!parsed){ alert(bkT('missing')); return; }
    await runBackup(true);   // نسخة أمان من الوضع الحالي قبل الاستبدال
    db = parsed.db || {};
    expenses = parsed.expenses || {};
    dietFiles = parsed.dietFiles || [];
    saveDB(); saveExpenses(); saveDietFiles();
    render();
    renderBackupList();
    alert(bkT('restored'));
  }, 'backups');
}

/* تطبيق الإدارة على الهاتف: عامل خدمي (يفتح الواجهة حتى لو انقطع الخادم) + زر التثبيت */
(function(){
  try{
    if('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && (location.protocol==='https:'||/^(localhost|127\.0\.0\.1)$/.test(location.hostname))) navigator.serviceWorker.register('/admin-sw.js',{scope:'/'}).catch(function(){});
    var standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone, dp=null, gone=false;

      document.body.appendChild(b);
